<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../../styles.css">
<style>
body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:200px;}
.preview{display:flex;flex-direction:column;gap:40px;align-items:center;padding:40px;}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.label{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-family:var(--b);}
</style>
</head>
<body>
<div class="preview">
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center;">
    <span class="label">Terra (primary)</span>
    <div class="row">
      <a class="btn" href="#">Book a consultation</a>
      <a class="btn btn-primary" href="#">Check my date</a>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center;">
    <span class="label">Ink (secondary)</span>
    <div class="row">
      <a class="btn btn-ink" href="#">See our portfolio</a>
    </div>
  </div>
</div>
</body>
</html>
