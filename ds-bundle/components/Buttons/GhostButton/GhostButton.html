<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../../styles.css">
<style>
body{margin:0;background:var(--bg);}
.preview-dark{background:var(--forest-deep);display:flex;gap:16px;align-items:center;justify-content:center;padding:40px;flex-wrap:wrap;}
.preview-light{display:flex;gap:16px;align-items:center;justify-content:center;padding:40px;flex-wrap:wrap;}
.label{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-family:var(--b);text-align:center;padding:12px 0 4px;}
</style>
</head>
<body>
<p class="label" style="padding:20px 0 4px;color:var(--mute);">On dark background</p>
<div class="preview-dark">
  <a class="btn ghost" href="#">See our work</a>
  <a class="btn ghost" href="#">Learn more</a>
</div>
<p class="label">On light background</p>
<div class="preview-light">
  <a class="btn ghost-ink" href="#">Learn more</a>
  <a class="btn ghost-ink" href="#">View portfolio</a>
</div>
</body>
</html>
