<!-- @dsCard group="Content" name="WorkGrid" viewport="1200" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../../styles.css">
<style>
body{margin:0;background:var(--bg);}
/* Gradient placeholders in place of photos */
.tile.feature{background:linear-gradient(140deg,oklch(27% .05 150),oklch(22% .04 148));}
.tile.portrait{background:linear-gradient(140deg,oklch(34% .04 148),oklch(29% .05 145));}
.tile.quarter:nth-child(3){background:linear-gradient(140deg,oklch(39% .04 150),oklch(34% .03 148));}
.tile.quarter:nth-child(4){background:linear-gradient(140deg,oklch(36% .06 145),oklch(31% .04 148));}
.tile.quarter:nth-child(5){background:linear-gradient(140deg,oklch(32% .05 150),oklch(27% .04 148));}
.tile.quarter:nth-child(6){background:linear-gradient(140deg,oklch(30% .05 148),oklch(25% .04 150));}
</style>
</head>
<body>
<section class="work">
  <div class="work-head">
    <div>
      <span class="lab">Recent weddings</span>
      <h2 class="disp">The work</h2>
    </div>
    <a class="txt-link" href="#">View full portfolio</a>
  </div>
  <div class="grid">
    <a class="tile feature" href="#">
      <div class="cap"><b>Emma &amp; Ross</b><span>Edgewood Tahoe</span></div>
    </a>
    <a class="tile portrait" href="#">
      <div class="cap"><b>Niamh &amp; Nick</b><span>Hellman-Ehrman Mansion</span></div>
    </a>
    <a class="tile quarter" href="#">
      <div class="cap"><b>Allie &amp; Devin</b><span>Ritz-Carlton</span></div>
    </a>
    <a class="tile quarter" href="#">
      <div class="cap"><b>Katie &amp; James</b><span>Martis Camp</span></div>
    </a>
    <a class="tile quarter" href="#">
      <div class="cap"><b>Lynn &amp; Aaron</b><span>Old Greenwood</span></div>
    </a>
    <a class="tile quarter" href="#">
      <div class="cap"><b>Sam &amp; Matt</b><span>Palisades</span></div>
    </a>
  </div>
</section>
</body>
</html>
