<script>
(function () {
  document.querySelectorAll('[data-carousel]').forEach(function (c) {
    var track = c.querySelector('.gf-carousel-track');
    var prev = c.querySelector('[data-dir="prev"]');
    var next = c.querySelector('[data-dir="next"]');
    if (!track) return;
    function step() { var card = track.querySelector('.gf-testi'); var gap = parseFloat(getComputedStyle(track).columnGap) || 0; return card ? card.getBoundingClientRect().width + gap : track.clientWidth; }
    function update() { var max = track.scrollWidth - track.clientWidth; if (prev) prev.disabled = track.scrollLeft <= 4; if (next) next.disabled = track.scrollLeft >= max - 4; }
    if (prev) prev.addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
    if (next) next.addEventListener('click', function () { track.scrollBy({ left: step(), behavior: 'smooth' }); });
    track.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  });
})();
</script>
