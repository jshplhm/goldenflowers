<script>
/* Consultation lightbox + multi-step form behaviors (shared across the redesign system).
   - Button-style CTAs (.btn / .pill / .m-cta) pointing at /consultation-form open the modal,
     including on the Contact page itself — the lightbox is the preferred experience everywhere.
   - Plain text links to /consultation-form still navigate to the page (keeps Contact reachable, no-JS safe). */
(function(){
  var modal=document.getElementById('consult-modal');
  var lastFocus=null;
  /* iOS Safari ignores overflow:hidden on body, so the page behind the
     overlay can still scroll — which is also what draws the text caret
     offset from the input inside a fixed overlay. Freezing the body with
     position:fixed (restoring the scroll spot on close) fixes both. */
  var lockY=0;
  function lockBody(){
    lockY=window.scrollY||0;
    document.body.classList.add('modal-open');
    document.body.style.position='fixed';
    document.body.style.top=(-lockY)+'px';
    document.body.style.left='0';
    document.body.style.right='0';
  }
  function unlockBody(){
    document.body.classList.remove('modal-open');
    document.body.style.position='';
    document.body.style.top='';
    document.body.style.left='';
    document.body.style.right='';
    window.scrollTo(0,lockY);
  }
  function openModal(){
    if(!modal) return;
    lastFocus=document.activeElement;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    lockBody();
    var first=modal.querySelector('input, select, textarea, button');
    if(first) setTimeout(function(){ first.focus(); },60);
  }
  function closeModal(){
    if(!modal) return;
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
    unlockBody();
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  var TRIGGER='a.btn[href$="/consultation-form"],a.pill[href$="/consultation-form"],a.m-cta[href$="/consultation-form"],[data-consult-open]';
  // A few CTAs share the exact same label ("Check your date" appears in the
  // nav, the mobile menu, and the footer), so plain text alone can't tell
  // them apart — tag those with where they live. Everything else's own
  // wording is distinct enough that the page alone disambiguates it.
  function regionLabel(el){
    if(el.closest('.nav-r')) return 'Nav';
    if(el.closest('.mobile-menu')) return 'Mobile menu';
    if(el.closest('footer.site-footer')) return 'Footer';
    return '';
  }
  function recordCtaClick(trigger){
    var text=(trigger.textContent||'').replace(/\s+/g,' ').trim().replace(/\s*(→|->)\s*$/,'');
    var region=regionLabel(trigger);
    try{
      sessionStorage.setItem('gf_cta', JSON.stringify({
        page: location.pathname,
        button: region ? (region+' — '+text) : text
      }));
    }catch(e){}
  }
  document.addEventListener('click', function(e){
    var trigger=e.target.closest(TRIGGER);
    if(trigger){
      recordCtaClick(trigger);
      if(!modal) return;            // no modal on page (e.g. no-JS / missing include) -> let link navigate
      e.preventDefault();
      document.body.classList.remove('menu-open');
      openModal();
      return;
    }
    if(modal && (e.target===modal || e.target.closest('[data-consult-close]'))) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(!modal || !modal.classList.contains('open')) return;
    if(e.key==='Escape'){ closeModal(); return; }
    /* Keep Tab cycling inside the open dialog. */
    if(e.key==='Tab'){
      var focusables=modal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
      // offsetParent!==null drops hidden controls (step 2, the X on step 1).
      // tabIndex>=0 and the aria-hidden check drop the off-screen honeypot,
      // which is reachable to the selector but not to a real keyboard user —
      // leaving it in made the first/last boundaries wrong, so Shift+Tab off
      // the first field escaped the dialog to the browser chrome.
      var vis=Array.prototype.filter.call(focusables,function(el){
        return el.offsetParent!==null && el.tabIndex>=0 && !el.closest('[aria-hidden="true"]');
      });
      if(!vis.length) return;
      var first=vis[0], last=vis[vis.length-1], active=document.activeElement;
      if(!modal.contains(active)){ e.preventDefault(); (e.shiftKey?last:first).focus(); }
      else if(e.shiftKey && active===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && active===last){ e.preventDefault(); first.focus(); }
    }
  });
})();

/* Captures how a visitor arrived (utm params + referrer) once per session, on
   whichever page they land on first, so the consult form — however many
   pages later they reach it — can report the true source instead of just
   "goldenflorals.com" (the referrer of the page before it). */
(function(){
  try{
    if(!sessionStorage.getItem('gf_source')){
      var qs=new URLSearchParams(location.search);
      sessionStorage.setItem('gf_source', JSON.stringify({
        utm_source: qs.get('utm_source')||'',
        utm_medium: qs.get('utm_medium')||'',
        utm_campaign: qs.get('utm_campaign')||'',
        referrer: document.referrer||''
      }));
    }
  }catch(e){}
})();

/* Real calendar-date + reasonable-year-range check, shared by the mask
   render and the step-1 -> step-2 advance guard. Mirrors the server-side
   check in consultation-form-doPost.gs — keep both in sync. */
function dateIssue(v){
  if(!v) return '';
  var m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return 'Use mm/dd/yyyy.';
  var mm=+m[1],dd=+m[2],yyyy=+m[3];
  var d=new Date(yyyy,mm-1,dd);
  if(d.getFullYear()!==yyyy||d.getMonth()!==mm-1||d.getDate()!==dd) return "That date doesn't exist.";
  var thisYear=new Date().getFullYear();
  if(yyyy<thisYear-1) return 'That date has already passed.';
  if(yyyy>thisYear+6) return 'That year looks off — mind checking it?';
  return '';
}
function applyDateValidity(el){ if(el) el.setCustomValidity(dateIssue(el.value)); }

/* Phone sanity check for the text channel. Mirrors the server-side rule in
   consultation-form-doPost.gs — keep both in sync. */
function phoneIssue(v){
  if(!v) return '';
  if(!/^[\d\s().+-]+$/.test(v)) return 'Just the number, please.';
  var d=v.replace(/\D/g,'');
  if(d.length<10) return 'Please include your area code.';
  if(d.length>15) return 'That looks like too many digits.';
  return '';
}

/* Google Ads conversion, fired at most once per site load per send_to.
   Guarded so a missing/blocked gtag (ad-blocker, GA4 disabled off-domain)
   never throws and never breaks the form. */
function gfConversion_(sendTo){
  if(typeof gtag==='function') gtag('event','conversion',{'send_to':sendTo});
}

function sourceParams_(){
  var out={}; try{ var raw=sessionStorage.getItem('gf_source'); if(raw) out=JSON.parse(raw); }catch(e){}
  return out;
}
// The page/button that opened the form, most recent click wins. Falls back
// to "landed here directly, no CTA click" (e.g. a typed URL or bookmark)
// so the Page column is still populated even without a recorded click.
function ctaParams_(){
  try{ var raw=sessionStorage.getItem('gf_cta'); if(raw) return JSON.parse(raw); }catch(e){}
  return { page: location.pathname, button: '' };
}
function appendCommon_(params, form){
  params.append('lead_id', form.dataset.leadId||'');
  params.append('ts', form.dataset.renderedAt||'');
  var hp=form.querySelector('[name="gf_hp"]');
  params.append('gf_hp', hp?hp.value:'');
  var s=sourceParams_();
  ['utm_source','utm_medium','utm_campaign','referrer'].forEach(function(k){ params.append(k, s[k]||''); });
  var c=ctaParams_();
  params.append('cta_page', c.page||'');
  params.append('cta_button', c.button||'');
}

/* Two-step reveal + mm/dd/yyyy date mask + in-place AJAX success. Binds every consult form on the page. */
(function(){
  document.querySelectorAll('form[data-multistep]').forEach(function(form){
    var step1=form.querySelector('.form-step-1'), step2=form.querySelector('.form-step-2');
    var advance=form.querySelector('.form-advance'), advanceBtn=form.querySelector('[data-form-advance]');
    var indicator=form.querySelector('.form-step-indicator'), backBtn=form.querySelector('[data-form-back]');
    var heading=form.querySelector('[data-form-heading]');
    var seg2=form.querySelector('[data-progress-step2]');
    if(!step2||!advanceBtn) return;
    step2.hidden=true;
    function setStep(n){
      if(backBtn) backBtn.hidden=(n===1);
      if(seg2) seg2.classList.toggle('on', n===2);
      if(heading) heading.textContent=(n===2)?'A few more details.':'Is your date open?';
    }
    /* Contact chooser, check all that apply. Each checked channel reveals
       its field (the .open class; CSS :has() doubles it for no-JS) and
       enables its input; unchecked inputs stay disabled so they neither
       block validation nor submit. One shared no-spam line follows the
       selection. */
    var chooser=form.querySelectorAll('input[name="contact_method"]');
    var reachBlocks={Email:form.querySelector('[data-reach-email]'),Text:form.querySelector('[data-reach-phone]')};
    var reachNote=form.querySelector('[data-reach-note]');
    var NOTES={Email:"We don't send marketing email.",
               Text:"We don't send marketing texts.",
               both:"We don't send marketing emails or texts."};
    function checkedMethods(){
      return Array.prototype.filter.call(chooser,function(c){ return c.checked; })
        .map(function(c){ return c.value; });
    }
    function syncChannels(){
      var on=checkedMethods();
      ['Email','Text'].forEach(function(k){
        var active=on.indexOf(k)!==-1, block=reachBlocks[k];
        if(!block) return;
        block.classList.toggle('open', active);
        var input=block.querySelector('input');
        if(input){ input.disabled=!active; input.required=active; }
      });
      chooser.forEach(function(c){
        var l=c.closest('label'); if(l) l.classList.toggle('sel', c.checked);
        c.setCustomValidity(''); // any change clears the "pick one" message
      });
      if(reachNote){
        reachNote.classList.toggle('on', on.length>0);
        if(on.length) reachNote.textContent=(on.length>1)?NOTES.both:NOTES[on[0]];
      }
    }
    form._checkedMethods=checkedMethods;
    if(chooser.length){
      syncChannels(); // nothing chosen yet: both contact inputs parked
      chooser.forEach(function(c){ c.addEventListener('change', syncChannels); });
      var phoneEl=reachBlocks.Text&&reachBlocks.Text.querySelector('input[type="tel"]');
      if(phoneEl){
        phoneEl.addEventListener('blur', function(){
          phoneEl.setCustomValidity(phoneIssue(phoneEl.value));
          if(phoneEl.value) phoneEl.reportValidity();
        });
      }
    }
    form.dataset.leadId=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('c-'+Date.now()+'-'+Math.random().toString(36).slice(2));
    form.dataset.renderedAt=String(Date.now());
    function toTop(){ var m=form.closest('.modal'); if(m) m.scrollTop=0; }
    advanceBtn.addEventListener('click', function(){
      var reqs=form.querySelectorAll('.form-step-1 [required]');
      for(var i=0;i<reqs.length;i++){ if(reqs[i].disabled) continue; if(!reqs[i].reportValidity()) return; }
      // Checkboxes don't group-validate natively the way radios do.
      var boxes=form.querySelectorAll('.form-step-1 [name="contact_method"]');
      if(boxes.length && form._checkedMethods && !form._checkedMethods().length){
        boxes[0].setCustomValidity('Pick email or text (or both).');
        boxes[0].reportValidity();
        return;
      }
      var dateEl=form.querySelector('.form-step-1 [data-date-mask]');
      if(dateEl){ (dateEl._finalizeYear||function(){ applyDateValidity(dateEl); })(); if(!dateEl.reportValidity()) return; }
      var phoneCheck=form.querySelector('.form-step-1 input[type="tel"]');
      if(phoneCheck && !phoneCheck.disabled){
        phoneCheck.setCustomValidity(phoneIssue(phoneCheck.value));
        if(!phoneCheck.reportValidity()) return;
      }
      if(!form.dataset.partialSent && form.hasAttribute('data-ajax')){
        form.dataset.partialSent='1';
        try{
          var p=new URLSearchParams();
          ['date','name','email','phone'].forEach(function(n){
            var f=form.querySelector('[name="'+n+'"]');
            p.append(n,(f&&!f.disabled)?f.value:'');
          });
          p.append('contact_method', form._checkedMethods?form._checkedMethods().join(', '):'');
          p.append('status','partial');
          p.append('k','gf-lupine-26');
          appendCommon_(p, form);
          fetch(form.action,{method:'POST',body:p}).catch(function(){});
        }catch(e){}
      }
      if(step1) step1.hidden=true;
      if(advance) advance.hidden=true;
      step2.hidden=false;
      setStep(2);
      toTop();
      // Genuine step-1 -> step-2 advance (all validation passed above).
      // Once per form session, even if the couple goes Back and Continues again.
      if(!form.dataset.gtagStep1){
        form.dataset.gtagStep1='1';
        gfConversion_('AW-18321282634/ses2CNj6_M8cEMqsoqBE');
      }
    });
    if(backBtn) backBtn.addEventListener('click', function(){
      step2.hidden=true; if(step1) step1.hidden=false; if(advance) advance.hidden=false;
      setStep(1); toTop();
    });
  });

  function mask(value, advance){
    var d=value.replace(/\D/g,'').slice(0,8); if(!d) return '';
    var out='',i=0,a=d[0];
    if(a>='2'){ out='0'+a; i=1; }
    else if(a==='1'){ if(d.length<2) return '1'; if(d[1]<='2'){ out='1'+d[1]; i=2; } else { out='01'; i=1; } }
    else { if(d.length<2) return '0'; if(d[1]==='0') return '0'; out='0'+d[1]; i=2; }
    if(i>=d.length) return advance?out+'/':out;
    out+='/'; var b=d[i];
    if(b>='4'){ out+='0'+b; i+=1; }
    else if(b==='3'){ if(i+1>=d.length) return out+'3'; if(d[i+1]<='1'){ out+='3'+d[i+1]; i+=2; } else { out+='03'; i+=1; } }
    else if(b==='0'){ if(i+1>=d.length) return out+'0'; if(d[i+1]==='0') return out+'0'; out+='0'+d[i+1]; i+=2; }
    else { if(i+1>=d.length) return out+b; out+=b+d[i+1]; i+=2; }
    if(i>=d.length) return advance?out+'/':out;
    // Year: it's always 20xx, so two digits finish it — "27" becomes 2027
    // the moment it's typed (streaming "061127" works too). A lone "2" is
    // ambiguous (start of "2027" typed in full vs shorthand "27"), so it
    // waits for the next digit; "20…" passes through as a full year, which
    // is safe because 2020 is outside the valid range and can only mean
    // the century. Expansion happens only while typing forward, never on
    // deletes, and never on a timer.
    var y=d.slice(i,i+4);
    if(!advance || y==='2' || (y.length>=2&&y.slice(0,2)==='20')) return out+'/'+y;
    return out+'/'+('20'+y).slice(0,4);
  }
  document.querySelectorAll('[data-date-mask]').forEach(function(el){
    var field=document.createElement('span'); field.className='date-field';
    el.parentNode.insertBefore(field, el); field.appendChild(el);
    var ghost=document.createElement('span'); ghost.className='date-ghost'; ghost.setAttribute('aria-hidden','true');
    var gt=document.createElement('span'); gt.className='gt'; var rest=document.createTextNode('');
    ghost.appendChild(gt); ghost.appendChild(rest); field.appendChild(ghost);
    el.removeAttribute('placeholder');
    function render(){ gt.textContent=el.value; rest.nodeValue='mm/dd/yyyy'.slice(el.value.length); }
    // Mostly vestigial now that the mask expands 2-digit years live, but a
    // paste or delete can still leave a bare 2-digit year at blur/Continue.
    // "20" is exempt: that's the century prefix mid-type (someone typing
    // "2027" in full), not shorthand for 2020 — expanding it would revive
    // the old hijack bug. It just fails the format check instead.
    function finalizeYear(){
      var m=el.value.match(/^(\d\d\/\d\d\/)(\d\d)$/);
      if(m&&m[2]!=='20'){ el.value=m[1]+'20'+m[2]; render(); }
      applyDateValidity(el);
    }
    el._finalizeYear=finalizeYear;
    el.addEventListener('input', function(e){
      var deleting=e.inputType && e.inputType.indexOf('delete')===0;
      el.value=mask(el.value, !deleting); render();
      el.setCustomValidity(''); // don't flag mid-edit; finalizeYear re-checks when typing settles
    });
    el.addEventListener('blur', function(){ finalizeYear(); el.reportValidity(); });
    render();
  });

  /* xxx-xxx-xxxx as they type — same shape as the placeholder. Strips a
     pasted/autofilled leading 1 or +1. A dash only auto-appends while
     typing forward, never after a delete (and never on a timer — same
     rule the date mask learned the hard way). */
  function phoneMask(v, advance){
    var d=v.replace(/\D/g,'');
    if(d.length>10&&d.charAt(0)==='1') d=d.slice(1);
    d=d.slice(0,10);
    if(d.length>6) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
    if(d.length===6&&advance) return d.slice(0,3)+'-'+d.slice(3)+'-';
    if(d.length>3) return d.slice(0,3)+'-'+d.slice(3);
    if(d.length===3&&advance) return d+'-';
    return d;
  }
  document.querySelectorAll('[data-phone-mask]').forEach(function(el){
    el.addEventListener('input', function(e){
      var deleting=e.inputType && e.inputType.indexOf('delete')===0;
      el.value=phoneMask(el.value, !deleting);
      el.setCustomValidity(''); // don't flag mid-edit; blur/Continue re-check
    });
  });

  function fmtDate(v){
    if(!v) return ''; var m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if(m){ var d=new Date(+m[3],+m[1]-1,+m[2]); if(!isNaN(d)) return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }
    return v;
  }
  /* First name(s) for the greeting. "Katie Smith" -> "Katie";
     "Katie and Aaron", "Katie & Aaron Jones", "Katie, Aaron" -> "Katie and
     Aaron". First letter capitalized so a lowercase "josh" reads "Josh". */
  function greetName(raw){
    var v=(raw||'').trim(); if(!v) return '';
    var firsts=v.split(/\s*(?:,|\band\b|&|\+)\s*/i).map(function(p){
      var w=p.trim().split(/\s+/)[0]||'';
      return w?w.charAt(0).toUpperCase()+w.slice(1):'';
    }).filter(Boolean);
    if(firsts.length>1) return firsts.slice(0,-1).join(', ')+' and '+firsts[firsts.length-1];
    return firsts[0]||'';
  }
  function showSuccess(form, data){
    var wrap=form.closest('[data-form-wrap]')||form.parentNode;
    var success=wrap.querySelector('[data-form-success]');
    if(!success){ var n=form.querySelector('[name="_next"]'); window.location=n?n.value:'/'; return; }
    var firstName=greetName(data.get('name'));
    var nameEl=success.querySelector('[data-success-name]');
    if(nameEl&&firstName) nameEl.textContent=', '+firstName;
    var dateVal=data.get('date');
    var dateLine=success.querySelector('[data-success-date-line]'), dateEl=success.querySelector('[data-success-date]');
    if(dateVal&&dateEl&&dateLine){ dateEl.textContent=fmtDate(dateVal); dateLine.hidden=false; }
    // Step 1 stays generic ("Making sure your date is open.") — the specific
    // date already sits in the lede one line up, and repeating it there was
    // the thing that wrapped on long months.
    // "You hear from us" names the channel they picked. Kept short (no "you")
    // so each line survives a phone screen unwrapped.
    var noteEl=success.querySelector('[data-success-note]');
    var methods=data.getAll?data.getAll('contact_method'):[];
    if(noteEl&&methods.length){
      noteEl.textContent=(methods.length>1)?'Brittany messages within 48 hours.'
        :(methods[0]==='Text'?'Brittany texts within 48 hours.'
        :'Brittany emails within 48 hours.');
    }
    var closeBtn=wrap.querySelector('.modal-close');
    if(closeBtn) closeBtn.hidden=false; // X only appears once they're done
    form.hidden=true;
    Array.prototype.forEach.call(wrap.children, function(el){ if(el!==success && !el.classList.contains('modal-close')) el.classList.add('is-gone'); });
    success.hidden=false; success.setAttribute('tabindex','-1');
    success.scrollIntoView({behavior:'smooth',block:'center'}); success.focus();
  }
  document.querySelectorAll('form[data-ajax]').forEach(function(form){
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var btn=form.querySelector('[type="submit"]'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
      var old=form.querySelector('[data-send-error]'); if(old) old.remove();
      var data=new FormData(form);
      var params=new URLSearchParams(); data.forEach(function(v,k){ params.append(k,v); });
      // Both channels checked posts contact_method twice, but Apps Script's
      // e.parameter only surfaces the first — send one joined value instead.
      var methods=data.getAll('contact_method');
      if(methods.length>1){ params.delete('contact_method'); params.append('contact_method', methods.join(', ')); }
      params.append('k','gf-lupine-26');
      appendCommon_(params, form);
      // The thank-you only appears once the request has actually gone
      // through — a failure surfaces as "Try again" instead of a silent
      // false success. fetch() resolves on HTTP errors too, so a 4xx/5xx
      // from the endpoint (quota, misdeploy) must be thrown explicitly or
      // a lost lead would still see the thank-you. The 1s floor keeps fast
      // sends from feeling abrupt; a cold start just holds "Sending…".
      var send=fetch(form.action,{method:'POST',body:params,keepalive:true})
        .then(function(r){ if(!r.ok) throw new Error('send failed: HTTP '+r.status); });
      var beat=new Promise(function(r){ setTimeout(r,1000); });
      Promise.all([send,beat]).then(function(){
        showSuccess(form,data);
        // Only reached on a real successful send (send throws on non-OK HTTP,
        // routing failures to .catch). Once per form session.
        if(!form.dataset.gtagConversion){
          form.dataset.gtagConversion='1';
          gfConversion_('AW-18321282634/z60CCNX6_M8cEMqsoqBE');
        }
      }).catch(function(){
        if(btn){ btn.disabled=false; btn.textContent='Try again →'; }
        var note=document.createElement('p');
        note.className='field-hint'; note.setAttribute('data-send-error','');
        note.style.textAlign='center'; note.style.marginTop='10px';
        note.textContent="That didn't send — check your connection and try again.";
        (form.querySelector('.form-submit')||form).appendChild(note);
      });
    });
  });

  /* Venue type-ahead: a plain text field (any venue can be typed) that
     suggests matches from the /venues lists as the couple types. Selecting
     a suggestion just fills the input — nothing is required to match. */
  document.querySelectorAll('[data-venue-combo]').forEach(function(combo){
    var input=combo.querySelector('input'), panel=combo.querySelector('.venue-suggest');
    var names=[]; try{ names=JSON.parse(combo.dataset.venues||'[]'); }catch(e){}
    if(!input||!panel||!names.length) return;
    var active=-1;
    function close(){ panel.hidden=true; panel.innerHTML=''; active=-1; input.setAttribute('aria-expanded','false'); }
    function pick(name){ input.value=name; close(); }
    function render(){
      var q=input.value.trim().toLowerCase();
      var hits=q?names.filter(function(n){ return n.toLowerCase().indexOf(q)!==-1; }).slice(0,6):[];
      if(!hits.length){ close(); return; }
      // exact match already picked/typed -> nothing left to suggest
      if(hits.length===1 && hits[0].toLowerCase()===q){ close(); return; }
      panel.innerHTML=''; active=-1;
      hits.forEach(function(n){
        var b=document.createElement('button'); b.type='button'; b.setAttribute('role','option');
        var i=n.toLowerCase().indexOf(q);
        b.appendChild(document.createTextNode(n.slice(0,i)));
        var em=document.createElement('strong'); em.textContent=n.slice(i,i+q.length); b.appendChild(em);
        b.appendChild(document.createTextNode(n.slice(i+q.length)));
        b.addEventListener('mousedown', function(ev){ ev.preventDefault(); pick(n); });
        panel.appendChild(b);
      });
      panel.hidden=false; input.setAttribute('aria-expanded','true');
    }
    input.addEventListener('input', render);
    input.addEventListener('keydown', function(e){
      if(panel.hidden) return;
      var items=panel.querySelectorAll('button');
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        e.preventDefault();
        active=(active+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
        items.forEach(function(el,i){ el.classList.toggle('active', i===active); });
        items[active].scrollIntoView({block:'nearest'});
      } else if(e.key==='Enter'){
        e.preventDefault(); // never submit through an open suggestion panel
        if(active>-1) pick(items[active].textContent); else close();
      } else if(e.key==='Escape'){
        e.stopPropagation(); // close only the panel, not the whole lightbox
        close();
      }
    });
    input.addEventListener('blur', function(){ setTimeout(close,120); });
  });

  /* Soft, non-blocking heads-up if an email's domain can't receive mail
     (same free Google DNS lookup the server does authoritatively). Never
     blocks submission — just a hint to double-check a typo. */
  document.querySelectorAll('form[data-multistep] input[type="email"]').forEach(function(el){
    var hint=null;
    el.addEventListener('blur', function(){
      var v=el.value.trim();
      if(hint){ hint.remove(); hint=null; }
      var m=v.match(/^[^\s@]+@([^\s@]+\.[^\s@]{2,})$/);
      if(!m) return;
      var domain=m[1];
      fetch('https://dns.google/resolve?name='+encodeURIComponent(domain)+'&type=MX')
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(el.value.trim()!==v) return; // value changed while we waited; drop stale result
          var noMx=!(data && data.Status===0 && data.Answer && data.Answer.length);
          if(noMx){
            hint=document.createElement('p');
            hint.className='field-hint';
            hint.textContent="This email domain doesn't look like it can receive mail — worth double-checking?";
            el.parentNode.appendChild(hint);
          }
        }).catch(function(){});
    });
  });

  /* Direct landing on the inline success hash (no-JS fallback path). */
  if(window.location.hash==='#consultation-success'){
    var f=document.getElementById('consultation-form'), s=document.getElementById('consultation-success');
    if(f) f.hidden=true; if(s) s.hidden=false;
  }
})();

/* Mobile bottom-sheet polish + step/thank-you motion. PURELY presentational and
   fully decoupled from the form logic above: it observes the same hidden/class
   toggles the form already drives, so if any of this no-ops the form still
   validates, submits, and shows the thank-you exactly as before. */
(function(){
  var modal=document.getElementById('consult-modal');
  if(!modal) return;
  var sheet=modal.querySelector('.modal');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var vv=window.visualViewport;

  /* Phones: pin the overlay to the *visual* viewport so the sheet can never sit
     behind the on-screen keyboard. The overlay shrinks to the visible area, the
     bottom-anchored sheet rides just above the keyboard, and its content scrolls
     internally. (A margin-based lift is unreliable on iOS with a fixed body.) */
  function resetSheet(){
    modal.style.top=''; modal.style.height=''; modal.style.bottom='';
    if(sheet) sheet.style.removeProperty('--sheeth');
  }
  /* Scroll the sheet's own overflow so a field sits centered in the visible
     window. Direct scrollTop (not scrollIntoView, which unreliably picks the
     scroller inside a fixed, height-capped sheet). */
  function revealField(el){
    if(!el||!sheet||sheet.scrollHeight<=sheet.clientHeight+2) return;
    var sr=sheet.getBoundingClientRect(), er=el.getBoundingClientRect();
    var delta=(er.top - sr.top) - (sr.height/2 - er.height/2);
    if(Math.abs(delta)>4) sheet.scrollTo({top:sheet.scrollTop+delta, behavior:'smooth'});
  }
  /* Defer the reveal until AFTER the sheet has reflowed to the new (keyboard)
     height — reading rects synchronously inside the resize gives stale values. */
  var revealT;
  function scheduleReveal(){
    clearTimeout(revealT);
    revealT=setTimeout(function(){
      var a=document.activeElement;
      if(a && a.matches && a.matches('input,select,textarea') && sheet.contains(a)) revealField(a);
    }, 80);
  }
  function fitKeyboard(){
    if(!vv || !sheet) return;
    if(!modal.classList.contains('open') || window.innerWidth>600){ resetSheet(); return; }
    modal.style.top=Math.round(vv.offsetTop)+'px';
    modal.style.height=Math.round(vv.height)+'px';
    modal.style.bottom='auto';
    sheet.style.setProperty('--sheeth', Math.round(vv.height*0.94)+'px');
    scheduleReveal();
  }
  if(vv){ vv.addEventListener('resize',fitKeyboard); vv.addEventListener('scroll',fitKeyboard); }
  new MutationObserver(function(){
    if(modal.classList.contains('open')) fitKeyboard(); else resetSheet();
  }).observe(modal,{attributes:true,attributeFilter:['class']});
  /* Bring the field you just tapped into view once the keyboard has settled. */
  modal.addEventListener('focusin', function(e){
    if(window.innerWidth>600) return;
    var el=e.target;
    if(el && el.matches && el.matches('input,select,textarea')){
      setTimeout(function(){ revealField(el); }, 280);
    }
  });

  /* Tapping Email/Text drops the cursor straight into its field (the sheet
     grows up to meet it). Runs after the form's own change handler enables it. */
  modal.querySelectorAll('input[name="contact_method"]').forEach(function(c){
    c.addEventListener('change', function(){
      if(!c.checked) return;
      var block=modal.querySelector(c.value==='Email'?'[data-reach-email]':'[data-reach-phone]');
      var input=block&&block.querySelector('input');
      if(input) setTimeout(function(){ if(!input.disabled) input.focus(); }, 60);
    });
  });

  if(reduce) return; // everything below is decorative

  function replay(el, cls){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  var step1=modal.querySelector('.form-step-1'), step2=modal.querySelector('.form-step-2');
  var success=modal.querySelector('[data-form-success]');
  function watch(el, fn){ if(el) new MutationObserver(fn).observe(el,{attributes:true,attributeFilter:['hidden']}); }
  watch(step2, function(){ if(!step2.hidden) replay(step2,'step-anim'); });
  watch(step1, function(){ if(!step1.hidden) replay(step1,'step-anim'); }); // Back
  watch(success, function(){ if(!success.hidden) replay(success,'celebrate'); });
})();
</script>
