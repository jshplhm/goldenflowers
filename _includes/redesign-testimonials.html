<div class="testi-carousel" data-testi-carousel>
  <div class="testi-controls">
    <button class="testi-nav prev" type="button" data-testi-prev aria-label="Previous reviews">&larr;</button>
    <button class="testi-nav next" type="button" data-testi-next aria-label="Next reviews">&rarr;</button>
  </div>
  <div class="testi-row" data-testi-row tabindex="0" role="group" aria-label="Couple reviews, scrollable">
    {%- for t in site.data.testimonials.items %}
    <div class="quote-card"><div class="stars">★★★★★</div><p><span data-ed="testimonials:items.{{ forloop.index0 }}.quote">{{ t.quote }}</span></p><p class="src"><b><span data-ed="testimonials:items.{{ forloop.index0 }}.name">{{ t.name }}</span></b><span class="src-venue"><span data-ed="testimonials:items.{{ forloop.index0 }}.context">{{ t.context }}</span></span></p></div>
    {%- endfor %}
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('[data-testi-carousel]').forEach(function(c){
    var row=c.querySelector('[data-testi-row]');
    var prev=c.querySelector('[data-testi-prev]'), next=c.querySelector('[data-testi-next]');
    function step(){ var card=row.querySelector('.quote-card'); return card ? card.getBoundingClientRect().width+24 : row.clientWidth*0.8; }
    function maxLeft(){ return row.scrollWidth-row.clientWidth-2; }
    next.addEventListener('click',function(){
      if(row.scrollLeft>=maxLeft()) row.scrollTo({left:0,behavior:'smooth'});      // wrap to first
      else row.scrollBy({left:step(),behavior:'smooth'});
    });
    prev.addEventListener('click',function(){
      if(row.scrollLeft<=2) row.scrollTo({left:maxLeft(),behavior:'smooth'});       // wrap to last
      else row.scrollBy({left:-step(),behavior:'smooth'});
    });
  });
})();
</script>
