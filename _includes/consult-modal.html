<div class="modal-overlay" id="consult-modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="consult-modal-title">
    <button class="modal-close" type="button" aria-label="Close" data-consult-close>&times;</button>
    <span class="label">Schedule a consultation</span>
    <h2 id="consult-modal-title">Let's start the conversation.</h2>
    <p class="modal-intro">We'll reach out within 48 hours to confirm availability and set a time. Consultations are complimentary, by phone or video.</p>
    <form action="https://formspree.io/f/xgobrjyo" method="POST">
      <input type="hidden" name="_subject" value="New consultation request, Golden Flowers">
      <input type="hidden" name="_next" value="{{ site.baseurl }}/weddings#consultation-success">
      <div class="field-full">
        <label for="m-name">Your name</label>
        <input type="text" id="m-name" name="name" placeholder="Full name" required>
      </div>
      <div class="field-full">
        <label for="m-email">Email address</label>
        <input type="email" id="m-email" name="email" placeholder="your@email.com" required>
      </div>
      <div>
        <label for="m-date">Wedding date</label>
        <input type="date" id="m-date" name="date">
      </div>
      <div>
        <label for="m-budget">Approximate budget</label>
        <select id="m-budget" name="budget">
          <option value="" disabled selected>Estimated florals budget</option>
          <option>$5,000–$8,000</option>
          <option>$8,000–$12,000</option>
          <option>$12,000–$18,000</option>
          <option>$18,000–$25,000</option>
          <option>$25,000+</option>
          <option>Not sure yet</option>
        </select>
      </div>
      <div class="field-full">
        <label for="m-message">Tell us about your wedding</label>
        <textarea id="m-message" name="message" placeholder="Venue, vision, anything that matters to you." rows="3"></textarea>
      </div>
      <div class="form-submit field-full">
        <button type="submit" class="btn-primary">Send consultation request</button>
        <p class="form-note">We'll respond within 48 hours</p>
      </div>
    </form>
  </div>
</div>
