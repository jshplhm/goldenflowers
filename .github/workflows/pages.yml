name: Build and deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Restore responsive image cache
        uses: actions/cache@v4
        with:
          path: .rsp-cache
          # run_id makes the key unique so the cache SAVES every run —
          # actions/cache skips saving on an exact-key hit, which froze the
          # cache contents and (with mtime-fragile skip logic) regenerated
          # ~950 variants on every deploy. The script skips work by source
          # content hash, so restoring any recent cache is always correct.
          key: rsp-${{ hashFiles('assets/images/**/*.jpg') }}-${{ github.run_id }}
          restore-keys: |
            rsp-${{ hashFiles('assets/images/**/*.jpg') }}-
            rsp-
      # BEFORE the build: the plugin reads .rsp-cache/manifest.txt to know which
      # variants exist, and will not advertise a WebP <source> that is missing.
      - name: Generate responsive image variants
        run: |
          command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends imagemagick webp
          RSP_PUBLISH=0 bash scripts/make-responsive-variants.sh
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      # jekyll build wipes _site, so the variants are copied in afterwards.
      - name: Publish responsive image variants
        run: bash scripts/make-responsive-variants.sh --publish-only
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
