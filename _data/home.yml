  button: Check your date
intro:
  paragraph1: Golden Flowers is a Lake Tahoe wedding florist creating elevated,
    sustainably grown floral artistry for couples getting married across the
    Sierra Nevada. We work with what California grows at its peak, in the season
    you're getting married, and we design around it, so the flowers belong to
    the place you're saying yes in.
  paragraph2: To us, every wedding is a unique piece of art. Our designs are
    refined and organic, grounded in texture and movement, curated around your
    venue and your season, and grown as close to the Sierra Nevada as the
    year allows.
why:
  label: Why Golden Flowers
  heading: We grow our own flowers on California soil, an hour from where you'll
    *say I do.*
  facts:
    - number: "01"
      title: Farm-grown
      body: Cultivated on our own California farm, where Brittany's training in
        agronomy and soil science shapes every planting, and sourced from growers
        we trust.
    - number: "02"
      title: Sustainable, always
      body: Seasonal sourcing, reusable mechanics, and growing practices that give
        back to the soil. Our full pledge is written down, in public.
    - number: "03"
      title: One wedding a day
      body: We never double-book. Our full team spends the day on your wedding and
        nothing else.
