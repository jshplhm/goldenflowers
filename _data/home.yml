hero:
  eyebrow: Lake Tahoe Wedding Florist
  heading: Flowers That Belong *Where The Are Grown*
  subheading: Artful and sustainable floral design for weddings across Lake Tahoe
    and the Sierra Nevada.
  button: Check your date
intro:
  paragraph1: "Golden Flowers is a luxury Lake Tahoe wedding florist creating
    elevated, artful and sustainable floral design for couples getting married
    across the Sierra Nevada. Our philosophy is simple: we design around what
    California grows best at the moment you get married. By sourcing seasonally
    and locally, we ensure your flowers belong to the landscape where you say I
    do."
  paragraph2: To us, each wedding is a piece of art with its own unique vision.
    Our designs are refined and elevated, grounded in texture and movement,
    curated around your venue and your season. The flowers we use to create are
    grown as close to the Sierra Nevada as the season allows.
why:
  label: Why Golden Flowers
  heading: We grow our own flowers on California soil, an hour from where you'll
    *say I do.*
  facts:
    - number: "01"
      title: Locally grown
      body: Field-grown on our own Nevada County organic and regenerative farm, where
        Brittany's expertise in agronomy and soil science shapes every planting,
        and sourced from local growers we trust.
    - number: "02"
      title: Sustainable, always
      body: Seasonal sourcing, foam-free, reusable mechanics, and growing practices
        that give back to the soil. Our full pledge is written down, in public.
    - number: "03"
      title: Depth over volume
      body: "Fewer weddings, more time on yours. We intentionally take fewer weddings
        than most studios so that yours isn't slotted into a production line. "
