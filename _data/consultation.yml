hero:
  label: Contact
  heading: Check your *date.*
  subheading: Tell us your date and venue, and we'll let you know if it's open.
next_steps:
  label: What happens next
  steps:
    - title: You send the form.
      body: Your date, your venue and how to reach you. It takes about a minute.
    - title: We reply promptly.
      body: We confirm we're open on your date and share our first thoughts on your
        venue and season.
    - title: We talk it through.
      body: A complimentary call, then a custom proposal built around your season and
        venue.
reach:
  label: Reach us directly
  location: Incline Village, NV
  note: By appointment. Serving Lake Tahoe, Truckee, Nevada City and beyond.
