  - label: Hyatt Regency Lake Tahoe
    url: /venues/hyatt-regency-lake-tahoe
    faqs:
      - q: Do you design florals for Hyatt Regency Lake Tahoe weddings?
        a: Yes. We're based in Incline Village, the same town as the resort, so we
          coordinate directly with the venue's events team and plan around
          load-in, ceremony, and reception spaces. Confirm your specific spaces
          with the resort, and we'll design for them.
      - q: Does being local actually make a difference?
        a: A real one. Site visits are a short drive for us. We can install early,
          adjust on the day, and come back for strike without a long haul over
          the pass, which keeps your timeline calm and your costs down.
      - q: What does a typical Hyatt wedding budget look like?
        a: Full-service resort florals typically range from
          <strong>$12,000–$22,000+</strong>, depending on guest count, ceremony
          installation, and reception scale. Every proposal is custom, built
          after your consultation.
      - q: What aesthetics work best here?
        a: All three of our directions translate well to a resort. <strong>Elevated
          Minimalist</strong> suits ballroom architecture; <strong>Wildflower
          Modern</strong> brings the outdoors into an indoor space; and rich,
          lush arrangements come alive under evening light. We'll match the
          design to your spaces and season.
      - q: How far in advance should I reach out?
        a: North Shore summer and fall dates book early, so reach out <strong>12–18
          months ahead</strong> if you can. If your date is sooner, ask anyway;
          we occasionally have late-availability openings.
  - label: Hellman-Ehrman Mansion
    url: /venues/hellman-ehrman-mansion
    faqs:
      - q: Do you design florals for Hellman-Ehrman Mansion weddings?
        a: Yes. We design for the lakefront ceremony site and the lawn reception at
          Sugar Pine Point, and we plan around the park's access, load-in
          windows, and leave-no-trace rules so setup and strike run cleanly.
      - q: Does a state park venue limit what's possible with flowers?
        a: The material rules are strict, but they leave the creativity alone. Floral
          foam and anything that can shed into the lake or forest are out, which
          suits us, since we've always worked foam-free. We use water sources,
          reusable mechanics, and compostable materials, so the design ambition
          stays high while the footprint stays at zero.
      - q: What does a typical wedding budget look like here?
        a: Full-service florals at Hellman-Ehrman typically range from
          <strong>$10,000–$18,000+</strong>, depending on guest count, ceremony
          installation, and reception scale. Every proposal is custom, built
          after your consultation.
      - q: What aesthetics work best at Sugar Pine Point?
        a: The wooded, lakefront setting is made for natural, gathered design, our
          <strong>Wildflower Modern</strong> direction especially. Cleaner,
          <strong>Elevated Minimalist</strong> arrangements also look striking
          against the historic mansion and the water. We design around the
          specific spots you're using.
      - q: How far in advance should I reach out?
        a: State-park dates are limited and reserved through California State Parks, so
          they go early. Reach out <strong>12–18 months ahead</strong> if you
          can. If your date is sooner, ask anyway and we'll let you know our
          availability.
  - label: North Tahoe Event Center
    url: /venues/north-tahoe-event-center
    faqs:
      - q: Do you design florals for North Tahoe Event Center weddings?
        a: Yes. We design for the lakefront ceremony and the indoor hall reception, and
          we plan around the venue's load-in windows and setup access so the day
          runs cleanly.
      - q: It's a pretty open, plain hall, can flowers really change that?
        a: That's exactly where florals earn their keep. A blank-canvas space lets us
          set the entire mood, palette, scale, and focal points, with
          installations and centerpieces instead of working around fixed decor.
          Couples are often surprised how completely the room transforms.
      - q: What does a typical wedding budget look like here?
        a: Full-service florals at the North Tahoe Event Center typically range from
          <strong>$12,000–$22,000+</strong>. Because it's a blank-canvas space,
          more of the wedding's look comes from flowers, so the floral budget
          often does more of the design work. Every proposal is custom, built
          after your consultation.
      - q: What aesthetics work best here?
        a: All three of our directions work, since the room is yours to define.
          <strong>Wildflower Modern</strong> brings the lakefront feeling
          indoors; <strong>Elevated Minimalist</strong> gives the open space
          clean structure; and rich, lush installations turn the hall into
          something dramatic for an evening reception.
      - q: How far in advance should I reach out?
        a: North Shore summer and fall dates book early, so reach out <strong>12–18
          months ahead</strong> if you can. If your date is sooner, ask anyway
          and we'll let you know our availability.
  - label: Valhalla Tahoe
    url: /venues/valhalla-tahoe
    faqs:
      - q: Do you design florals for Valhalla Tahoe weddings?
        a: Yes. We design for the Grand Hall, the boathouse, and the lakeside lawn at
          the Tallac Historic Site. We plan around the park's load-in windows
          and site guidelines so setup and breakdown run cleanly without those
          constraints landing on you.
      - q: What does a typical Valhalla wedding budget look like?
        a: Full-service florals here typically range from
          <strong>$10,000–$18,000</strong>, depending on installation scale and
          guest count. The Grand Hall takes statement pieces beautifully, so
          budget often rises with how much of the architecture you want the
          florals to work with. Every proposal is custom, built after your
          consultation.
      - q: Are there restrictions on florals at a state historic site?
        a: Valhalla has specific load-in timing and site rules as a historic property.
          We've worked within them before and build the whole day's logistics
          around them so nothing runs late or becomes your problem to manage. On
          the materials side, we've always worked foam-free, which aligns well
          with the environmental standards the site requires.
      - q: How far in advance should I reach out?
        a: Valhalla dates are limited by the park calendar, so they fill early. We
          recommend reaching out <strong>12–18 months ahead</strong> when you
          can. If your date is sooner, reach out anyway and we'll let you know
          our availability.
  - label: Old Greenwood
    url: /venues/old-greenwood
    faqs:
      - q: Do you design florals for Old Greenwood weddings?
        a: Yes. We design for the Old Greenwood lawns, indoor spaces, and the open
          Martis Valley setting, and we build pieces with the scale and
          structure to hold their own against big sky and open meadow. The same
          team designs, installs, and strikes, with full attention on your date.
      - q: What does a typical Old Greenwood wedding budget look like?
        a: Full-service florals here typically range from
          <strong>$12,000–$20,000</strong>, depending on installation scale and
          guest count. Open meadow venues often require taller, more
          architectural pieces that read across the space, which shapes the
          build. Every proposal is custom, built after your consultation.
      - q: How do you approach a setting this open and exposed?
        a: The meadow and open sky at Old Greenwood swallow small arrangements. We
          design with height, branching, and movement so the florals hold the
          space rather than disappearing into it. Everything is built foam-free
          to hold up through a long, sun-exposed mountain afternoon without
          wilting or shifting.
      - q: How far in advance should I reach out?
        a: Peak summer and fall Saturdays fill <strong>12–18 months ahead</strong>, so
          reach out early when you can. If your date is sooner, reach out anyway
          and we'll let you know our availability.
