  - label: Gar Woods
    url: /venues/gar-woods
    faqs:
      - q: Do you design florals for Gar Woods weddings?
        a: Yes. We design for the lakefront deck, pier, and intimate reception spaces at
          Gar Woods in Carnelian Bay. The setting is close to the water, so we
          design with the sightlines in mind and build pieces that frame the
          lake rather than block it.
      - q: What does a typical Gar Woods wedding budget look like?
        a: Full-service florals here typically range from
          <strong>$8,000–$16,000</strong>, reflecting the venue's intimate
          scale. Because every stem is seen up close on a smaller deck, detail
          and quality matter more than volume. Every proposal is custom, built
          after your consultation.
      - q: What makes designing for Gar Woods different?
        a: "The deck puts every arrangement at arm's length. There's no hiding behind
          scale or density here, so we design for close viewing: texture,
          movement, and blooms worth studying. West-facing water also means
          golden evening light, and we choose palettes that come alive in it
          rather than disappearing."
      - q: How far in advance should I reach out?
        a: Peak summer and fall Saturdays fill <strong>12–18 months ahead</strong>, so
          reach out early when you can. If your date is sooner, reach out anyway
          and we'll let you know our availability.
