          smooth and discreet.
      - q: What does a typical Martis Camp wedding budget look like?
        a: Full-service florals here typically range from
          <strong>$14,000–$25,000+</strong>. That covers consultation through
          day-of breakdown, ceremony installation, bridal party florals, and
          reception centerpieces. The range depends on table count, installation
          scale, and aesthetic. Every proposal is custom.
      - q: Which spaces do you design for?
        a: "We design for the spaces you're using: the lodge, the family barn, and the
          outdoor lawns, carrying one cohesive palette and language across the
          ceremony and reception so the day reads as a single designed event."
      - q: How far in advance should I reach out?
        a: Peak summer and fall Saturdays fill <strong>12–18 months ahead</strong>, so
          reach out early when you can. If your date is sooner, reach out anyway
