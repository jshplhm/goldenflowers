pages:
  - label: Weddings
    url: /weddings
    faqs:
      - q: What actually makes you different?
        a: <strong>Four specific things most florists can't say:</strong> We grow our
          own flowers on our California farm. We never use floral foam. We take
          one wedding per date, so your wedding day gets our full team from
          start to finish. And our founder Brittany is an artist and an
          agronomist, which means her design decisions are rooted in how plants
          actually grow.<br><br> Most florists source from the same wholesale
          importers and build the same kinds of arrangements. We work with what
          the California land is producing at peak, and we design around that.
          The result is florals that feel grounded, seasonal, and specific to
          the Sierra Nevada landscape where your wedding is happening.
      - q: What does "one wedding per date" actually mean?
        a: "It means we never double-book. When you book with us, Brittany and the whole
          Golden Flowers team is dedicated to your wedding, full stop. We won't
          be splitting time or attention with another couple on your day. Setup
          starts at the right time, nothing gets rushed, and the design you
          approved is what actually shows up. "
      - q: Why does it matter that you're foam-free?
        a: "Floral foam is a plastic-based product that sheds microplastics into water
          and soil and never biodegrades. Most florists use it because it's
          easier and faster. We don't use it because it contradicts everything
          we care about: the environmental ethic of our farm-grown sourcing, the
          integrity of the flowers, and the land where your wedding is
          happening. Foam-free arrangements require more skill to build. We've
          invested in that skill. Your flowers will look better for it and leave
          less impact on the place you love."
      - q: How far in advance should I reach out?
        a: For popular summer and fall Saturday dates at venues like Edgewood,
          Palisades, or the National Exchange Hotel, we recommend reaching out
          <strong>12–18 months in advance</strong>. Our calendar fills from the
          back forward, and peak dates go first. If your date is closer than 12
          months away, reach out anyway. We'll tell you honestly what's
          available. We occasionally have openings for mid-week, off-season, or
          non-peak dates.
      - q: What does a full-service wedding florals investment typically look like?
        a: "Our full-service weddings typically range from
          <strong>$5,000–$25,000+</strong>, depending on scale. A typical
          100-person Lake Tahoe wedding runs <strong>$12,000–$18,000</strong>.
          That includes everything: consultation, design proposal and mood
          board, ceremony installation, bridal and party florals, reception
          centerpieces, environmental florals, and full day-of setup and
          breakdown.<br><br> We build every proposal from scratch around your
          specific wedding, with no packages or minimums. After your
          consultation, you'll receive an itemized quote so you know exactly
          what you're paying for."
      - q: Can you work with my existing coordinator or planner?
        a: Yes, always. We work closely with coordinators and planners at all the venues
          we serve. If you're working with a planner, they'll be looped in from
          the proposal stage so timeline, logistics, and setup are coordinated.
          We're experienced working within planner-led events and take our cues
          from whoever is running point on the day.
      - q: Do you travel outside of Lake Tahoe?
        a: Yes. We work throughout the Sierra Nevada foothills and Gold Country, from
          Nevada City and Grass Valley to private estates across the region. The
          National Exchange Hotel, Miner's Foundry, and private ranches in the
          foothills are all part of our regular service area. Travel outside our
          primary service area may involve a travel fee, which we'll include in
          your proposal.
      - q: What if I'm not sure which aesthetic I want?
        a: "That's what the consultation is for. Bring whatever references you have:
          Pinterest boards, photos, a vibe description, an outfit. We're very
          good at translating what someone means from what they show us. We'll
          help you identify the aesthetic direction and show you examples of our
          work in that register. Many couples come in with \"I like moody but
          also clean?\" and leave with a crystal-clear vision.<br><br> You can
          also <a href=\"/portfolio\">browse the portfolio by aesthetic</a>
          before your consultation to get your bearings."
  - label: Edgewood Tahoe
    url: /venues/edgewood-tahoe
    faqs:
      - q: Do you design florals for Edgewood weddings?
        a: Yes. We design for Edgewood's lakeside ceremony spaces and the Edgewood
          Pavilion, and plan around the venue's logistics, load-in, and space
          constraints so setup runs cleanly on the day.
      - q: What does a typical Edgewood wedding budget look like?
        a: Edgewood weddings typically range from <strong>$12,000–$22,000+</strong> for
          full-service florals. This covers consultation through day-of
          breakdown, ceremony installation, bridal party florals, and reception
          centerpieces. The range depends on table count, installation scale,
          and aesthetic complexity. We'll build a custom proposal after your
          consultation.
      - q: Do you work with Edgewood's preferred vendors?
        a: Yes. If you're already working with a planner, we'll coordinate directly with
          them and the venue's events team. If not, we can recommend planners we
          trust for Lake Tahoe weddings. A well-coordinated vendor team makes
          everything on your wedding day run cleanly.
      - q: What aesthetics work best at Edgewood?
        a: "All three of our aesthetics work beautifully at Edgewood, for different
          reasons. <strong>Elevated Minimalist</strong> is the most popular: the
          clean lines work with the venue's architecture and the open lake view.
          <strong>Wildflower Modern</strong> works especially well for outdoor
          ceremonies on the lawn. Rich, lush arrangements come alive in the
          Pavilion's interior evening reception settings, deep tones and
          candlelight work beautifully there. We'll design around the specific
          spaces you're using."
      - q: How far in advance should I reach out?
        a: Edgewood dates book up fast, especially Saturday summer dates. We recommend
          reaching out <strong>12–18 months in advance</strong> if possible. If
          your date is sooner, reach out anyway and we'll let you know
          availability. We occasionally have late-availability openings.
  - label: Martis Camp
    url: /venues/martis-camp
    faqs:
