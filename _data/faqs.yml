      - q: Do you design for alpine venues like High Camp?
        a: "Yes. High-elevation venues are some of our favorites to design for, and they
          take specific know-how: conditioning for thin dry air, hardy stem
          selection, and a load-in planned around the tram. We'll walk you
          through exactly how we'd approach your ceremony and reception spaces."
      - q: What does a typical High Camp wedding budget look like?
        a: Full-service florals at venues like High Camp typically range from
          <strong>$12,000–$22,000+</strong>. That covers consultation through
          day-of breakdown, ceremony installation, bridal party florals, and
          reception centerpieces. The range depends on table count, installation
          scale, and aesthetic. Every proposal is custom.
      - q: How does the tram affect setup?
        a: Everything travels up by tram, so we build and pack with that in mind and
          coordinate load-in timing with your planner and the venue. It's a
          logistics question we plan for from the start.
      - q: How far in advance should I reach out?
        a: Peak summer and fall Saturdays fill <strong>12–18 months ahead</strong>, so
          reach out early when you can. If your date is sooner, reach out anyway
          and we'll let you know availability.
