katie-james: "A garden fairytale inside the stone hall of The Miner's Foundry.
  Blush and butter-cream roses built into a lavish arch over the tall arched
  windows, moss runners down the banquet tables, and candlelight everywhere:
  lush, romantic and a little storybook."
lynn-aaron: "A wedding at the top of the mountain. Palisades High Camp sits high
  above Olympic Valley with snow still on the peaks, and we met the setting with
  jewel tones: coral peonies, oxblood dahlias and trailing amaranthus, plus
  green-draped installations scaled for the mountaintop. Big landscape, big
  flowers."
jenna-cal: A white-and-green wedding with a thread of red running through it.
  Phalaenopsis orchids and magnolia foliage in clean, elevated arrangements,
  warmed by hanging red silk lanterns and glowing over candlelit tables at the
  National Exchange Hotel.
camille-max: An autumn celebration at the historic North Star House, where
  craftsman architecture and old oaks set the tone. We built cascading,
  garden-gathered bouquets of blush and burgundy roses trailing amaranthus, and
  an arbor that read as though it grew in place rather than being installed.
  Wild in feeling, considered in every detail.
kelly-dylan: Blue and citrus on the shore of Lake Tahoe. At the North Tahoe
  Event Center we leaned into a bright, coastal palette of delphinium, anemone
  and thistle with pops of orange ranunculus, in loose, wild bouquets that
  matched the open water and the mountain light.
tori-tucker: "Pink, green and a little bit whimsical, on the shore of Lake
  Tahoe. Garden roses and coral peonies, sweet peas and hydrangea against sage
  tablecloths and a lakeside setting at the North Tahoe Event Center: playful,
  colorful, and styled with an editorial eye."
mikayla-jeff: A modern and unique wedding inspired by Dr. Seuss
