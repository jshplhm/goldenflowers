# Studio page (/about). Rewritten 2026-09-26: the page now runs who (Brittany,
# then the team), how we work, what we believe, one review, the ask. The copy
# it replaced is kept for reference in _archive/studio-copy-before-2026-09-26.yml
# with a screenshot of the old page beside it.
hero:
  # "Studio", matching the nav label for this page.
  eyebrow: Studio
  heading: The team you want when it *has to be right.*
  subheading: Golden Flowers is a floral studio led by Brittany, an artist and an
    agronomist, and built around a team of seasoned designers. We design for the
    couples who marry in Lake Tahoe and across the Sierra Nevada.
brittany:
  heading: Brittany founded and leads the studio.
  # Designer first (Josh, 2026-09-26): the section opens on the artist, then
  # the agronomy, then what the agronomy means for your wedding. "Formal" or
  # "professional" training is fine to say.
  paragraphs:
    - She is a floral designer with formal training in Europe, and every
      proposal starts with her. She designs each one as if it's the only one
      she's ever working on, refined and grounded in texture and movement,
      choosing every flower for how it grows, moves and holds, and for what it
      brings to the whole.
    # The Whole Foods role was new product development; the point of it here is
    # the planning discipline that work demands, told lightly.
    - Her background runs just as deep on the science side, with a master's
      degree in agronomy and more than a decade in sustainable agriculture across
      Europe, North and South America and New Zealand. As an agronomist, she
      worked with Whole Foods to bring new varieties to market in a field where
      almost nothing is certain, from the weather to the yield.
    - That work runs on planning far in advance and a backup for every step that
      matters, and she plans a wedding the same way.
team:
  heading: The team that designs your flowers is the team that shows up to set them.
  # Don't characterise how the team is employed (no "collective", "freelance",
  # "chosen for each wedding").
  paragraphs:
    # Never "florists": they are designers and artists (Josh, 2026-09-26).
    - Brittany leads a team of accomplished floral designers with experience at
      the region's best studios and venues, artists we're privileged to build
      with.
    - The same hands arrange your flowers in the studio, adjust them in the room,
      and break everything down when the night ends.
planning:
  # Certainty told as competence. Never list what can go wrong with flowers
  # here: a fear named at section scale is a fear installed.
  heading: Planned months ahead, so your day feels effortless.
  paragraphs:
    - We take a limited number of weddings a season, so yours isn't slotted into
      a production line.
    - Most of the work that protects your day happens months before anyone sees a
      flower.
  points:
    # Backups and "months ahead" are said above; this card is what the
    # planning covers.
    - title: Every detail mapped
      body: Sourcing, delivery, timing and setup are worked out in detail long
        before the day.
    - title: Built for the mountains
      body: An agronomist's understanding of how every stem performs across a full
        day, conditioned for the altitude and the forecast we're actually going
        to get.
    - title: Calm on the day
      body: Our team is deep enough to absorb a surprise on the morning of, without
        it becoming your problem.
    - title: One team, start to finish
      body: Full service design from the first conversation through breakdown at the
        end of the night.
beliefs:
  heading: To us, every wedding is a unique piece of art.
  paragraphs:
    - Each one is curated around its venue, season, and vision. We design around
      what California grows best at the moment you get married.
    # Same wording as the home page's "Locally grown" card: "our plot", never
    # "our farm" or "our fields".
    - We grow on our own plot at an organic community farm in Nevada County, and
      what we don't grow ourselves comes from California growers we trust.
      Seasonal sourcing, foam-free, reusable mechanics, and growing practices
      that give back to the soil.
  link: Read our sustainability pledge
testimonial:
  quote: '"From the start they had a *streamlined process* and I never felt
    overwhelmed with the endless flower options."'
  name: Taylor
  context: Olympic Valley Stables
closing:
  # Brittany takes the first call herself, which is what makes this honest.
  heading: Ready to *meet Brittany?*
  body: Tell us your date and venue, and we'll let you know if it's open.
  button: Check your date
