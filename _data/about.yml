# About page copy (goldenflorals.com/about).
# Edit the text here; layout and photos stay put.
# Tip: wrap words in *asterisks* to make them italic, like *this*.

hero:
  eyebrow: Our Story
  heading: The team you want when it *has to be right.*
  subheading: Golden Flowers is a professional floral studio led by Brittany and built around a team of the region's most accomplished designers. We take one wedding a day and give it everything we have.

intro:
  label: What we're really for
  heading: A wedding day happens once. There is no rehearsal and no do-over.
  paragraphs:
    - "Golden Flowers exists to take that on: to plan for everything that can go wrong with cut flowers, and to make your design feel effortless on the one day it absolutely has to."
    - "Brittany founded and leads the studio, and her background runs deep: a master's in agricultural science, more than a decade in sustainable agriculture across Spain, Mexico, New Zealand, and the United States, and formal European floral design training."
    - "We're based in the Sierra Nevada and we design for the couples who marry here. The flowers are grown close by, the team is local and seasoned, and the standards don't move."

one_rule:
  label: Our one rule
  heading: One wedding a day, so the day is entirely yours.
  paragraph: "We take one wedding per date because of what it lets us give the couple whose date it is: every hour of that day and every hand on our team, focused on bringing one vision to life."
  kicker: Your date is the only wedding on our calendar that day. Always.

team:
  label: The team
  heading: We work alongside the best designers in the region, and beyond.
  paragraphs:
    - "Golden Flowers is a collective of accomplished florists, several of whom run their own studios and flower farms: seasoned designers we're privileged to build with, chosen for each wedding around its scale, style, and venue."
    - "The team that designs your flowers is the team that shows up to set them, adjusts them in the room, and breaks everything down when the night ends."

certainty:
  label: Why it matters
  heading: What you're really buying is certainty.
  paragraphs:
    - "Cut flowers are volatile. Stems wilt, blooms open early or refuse to, a shipment falls through, the heat turns, something breaks in transit. On an ordinary day that's a nuisance. On a wedding day it's a crisis, unless the people handling it have seen it before and planned for it."
    - "That's the expertise you're paying for. We engineer the sourcing, timing, and mechanics so the predictable problems never reach you, and we have the depth and the calm to solve the unpredictable ones in the moment, while the day keeps moving. The science background helps here too: knowing how a stem takes water, how a structure holds without foam, and how a flower will perform from setup through the last dance."
  points:
    - title: Planned in advance
      body: Sourcing, timing, and logistics are mapped before your week begins, with the risks engineered out early.
    - title: Calm under pressure
      body: When the inevitable happens, an experienced team solves it on-site without it becoming your problem.
    - title: Built to hold
      body: Foam-free construction and a grower's understanding of how every stem performs across a full day.
    - title: Grown close by
      body: "Our own California farm plots and trusted regional growers: short chains, fresh stems, no overseas shipping."

editorial:
  label: Rooted in place
  heading: We design with what the California land gives us, in the season you say yes.

seasonal:
  label: Seasonal availability
  heading: What's growing for your wedding.
  intro: California's seasons produce dramatically different palettes. Here's what we can source at its peak across the year.
  seasons:
    - name: Spring
      dates: March – May
      flowers:
        - Ranunculus (peak)
        - Anemone
        - Tulip, parrot & standard
        - Lilac & sweet pea
        - Early peonies (May)
        - Hellebore
        - Muscari & fritillaria
      note: "The most romantic palette of the year: rich jewel tones and soft pastels. Peak for Lush & Romantic."
    - name: Summer
      dates: June – August
      flowers:
        - Garden rose (peak)
        - Dahlia (mid–late)
        - Peony (early June)
        - Delphinium & larkspur
        - Native wildflowers
        - Sunflower & marigold
        - Lisianthus & cosmos
      note: Peak Lake Tahoe wedding season. Abundant, warm, and beautiful, ideal for all three aesthetics.
    - name: Fall
      dates: September – November
      flowers:
        - Dahlia (peak)
        - Chrysanthemum
        - Autumn-foliage branches
        - Amaranth, celosia
        - Dried & preserved stems
        - Persimmon & pyracantha
        - Squash & gourd accents
      note: "Dramatic harvest tones: the richest palette of the year for Lush & Romantic and Wildflower Modern."
    - name: Winter
      dates: December – February
      flowers:
        - Hellebore & anemone
        - Camellia & paperwhite
        - Evergreen branch & berry
        - Early forced tulip
        - Amaryllis
        - Dried & architectural stems
        - Moss, lichen & forage
      note: Quieter availability means intentional design. Winter florals lean into structure, texture, and restraint.
  footnote: Availability varies by year and growing conditions. Your proposal will reflect what's actually at peak in your specific season.

values:
  label: Philosophy
  heading: The principles behind the work.
  items:
    - title: Grown with intention
      body: We work with what California produces at its peak, in the season you're getting married, and we let the design respond to the land.
    - title: Designed from scratch
      body: Every wedding gets a design built from scratch around its venue, season, and vision. There are no packages. Brittany designs each proposal as if it's the only one she's ever working on.
    - title: Sustainable at the root
      body: Foam-free construction, California-grown sourcing, and farm practices that treat soil health as a long-term investment. The environmental ethic runs through the whole operation.

sustainability_pointer:
  label: Sustainability
  heading: Grown here, and grown responsibly.
  body: The commitments that shape how we design, source, and grow, from vase return to composting the harvest, are written down, in public, on their own page.
  link: Read our sustainability pledge

closing:
  label: Work with us
  heading: Start with a *conversation.*
  body: Reach out with your date and venue. We'll let you know if we're available.
  button: Schedule a consultation
