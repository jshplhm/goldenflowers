# Which weddings the home page previews, in order. Written by /edit
# ("Home weddings"). Exactly three: slot 1 is the large tile, slot 2 the
# tall tile beside it, slot 3 the wide closing band. Names and venues are
# read from portfolio_meta.yml, never stored here.
#
# focus is object-position for that photo in that slot. Slot 3 is a wide
# letterbox and usually wants a different value than a tall tile would.
- slug: katie-james
  photo: "08"
  focus: center 45%
- slug: lynn-aaron
  photo: "02"
  focus: center 50%
- slug: kelly-dylan
  photo: "07"
  focus: center center
