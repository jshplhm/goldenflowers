# Portfolio page copy. Editable in Pages CMS and the inline editor (/edit).
# *single asterisks* = italic, **double** = bold.
# NOTE: deliberately no wedding count in the heading or subheading — the number
# changes every time a wedding is added or retired.
header:
  label: "Portfolio"
  heading: A few of our favorite weddings.
  subheading: "Selected weddings across Lake Tahoe and the Sierra Nevada, each one
    built around a different landscape, venue, and couple."
cta:
  heading: "See something *you love?*"
  body: "Tell us your date and venue, and we'll let you know if it's open."
  button: "Check your date"
# Shared closing CTA on every individual wedding page.
wedding_cta:
  heading: Planning something *like this?*
  body: "Tell us your date and venue, and we'll let you know if it's open."
  button: "Check your date"
# Headings for the blocks on an individual wedding page.
wedding:
  credits_heading: "The team"
  credits_note: "A wedding is never one vendor's work. Everyone who shaped this
    day is credited here."
  more_heading: "More weddings"
  more_link: "Browse the portfolio"
  strip_cta: "View the wedding"
  strip_label: "The full gallery"
