# Portfolio page copy. Editable in Pages CMS and the inline editor (/edit).
# *single asterisks* = italic, **double** = bold.
# NOTE: deliberately no wedding count in the heading or subheading — the number
# changes every time a wedding is added or retired.
header:
  label: "Portfolio"
  heading: "A look into *our creative world.*"
  subheading: "Weddings across Lake Tahoe and the Sierra Nevada, each one built
    around a different landscape, venue, and couple."
cta:
  label: "Where yours begins"
  heading: "We've never built the same wedding *twice.*"
  body: "These are a sample, not a menu. Bring a Pinterest board, a venue photo,
    or a feeling you can't quite name yet, and we'll design from there."
  button: "Share your inspiration"
# Shared closing CTA on every individual wedding page.
wedding_cta:
  label: "Planning something like this?"
  heading: "Tell us your *date.*"
  body: "Our calendar is capped each season. Send your date and venue and we'll
    let you know if yours is still open."
  button: "Check your date"
# Headings for the blocks on an individual wedding page.
wedding:
  credits_heading: "The team"
  credits_note: "A wedding is never one vendor's work. Everyone who shaped this
    day is credited here."
  more_heading: "More weddings"
  more_link: "All weddings"
  swipe_hint: "Swipe for more"
  strip_cta: "View the wedding"
  strip_label: "The full gallery"
