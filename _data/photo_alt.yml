# One description per photograph, for Google Images and screen readers.
#
#   "<image path>": "<what is in the picture>"
#
# _plugins/photo_alt.rb applies these at build time to EVERY <img> on the site
# that shows this file, whatever template or blog post printed it, so a photo
# reads the same on its wedding page, its /portfolio card, a blog post and the
# More weddings row. A photo with no entry keeps whatever alt its template
# wrote (usually "<couple> wedding flowers at <venue>").
#
# Written 2026-09-26 by looking at each photo. Say what is in the frame: the
# couple, the flowers, the place. Name the venue where it helps; don't stuff
# keywords. Photos added later through /edit have no entry until one is added.

