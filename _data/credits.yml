# Vendor credits, per wedding. Shown in "The team" block on each wedding page.
#
# Every row is optional. Leave a `name` blank and the row disappears entirely,
# so a half-filled set still looks deliberate rather than broken. Give a `name`
# with no `url` and it renders as plain text; add a `url` and it links out.
#
# `photography`, `planning` and `venue` are the lead credits (set large). The
# rest render as a quiet three-column list in the order written here.
#
# Two credits are already known from the photographers' own file names:
#   kelly-dylan  -> Emma Wynn Paul Photography, planning by Honeysuckle Traditions
#   camille-max  -> Mountain Time Photo
# Everything else is waiting on Brittany.

defaults:
  # No master switch any more. Each wedding page shows "The team" as soon as it
  # has at least one real vendor, and hides it otherwise. `venue` and `florals`
  # do not count toward that: both are pre-filled everywhere, so counting them
  # would put a team of two on every page. See _includes/wedding-credits.html.
  florals:
    name: "Golden Flowers"
    url: "/"

lynn-aaron:
  photography: { name: "", url: "" }
  planning: { name: "", url: "" }
  venue: { name: "Palisades High Camp", url: "/venues/palisades-high-camp" }
  catering: { name: "", url: "" }
  cake: { name: "", url: "" }
  rentals: { name: "", url: "" }
  beauty: { name: "", url: "" }
