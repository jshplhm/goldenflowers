# ===========================================================================
# WEDDINGS  ->  /weddings  (Process & Pricing)
#
# 2026-08-15: the published price ladder was replaced by the floral estimator
# (_data/estimator.yml + _includes/estimator.html).
#
# WHAT CAME OUT, and where it went
#   - `pricing.tiers`  the three figures and their photos. The estimator
#     answers "what does it cost" now. The $7,500 minimum is still ENFORCED,
#     inside the estimator, but is no longer PUBLISHED: it appears only to a
#     visitor who has already described a wedding below it, so a planner
#     pricing a $40k wedding never sees a floor.
#   - `included`       the six "what's included" cards. The four things we
#     MAKE became the icons heading the estimator's four input sections; the
#     two things we DO were always process steps and live there now.
#   - `assurance`      already unused before this change.
#   Every one of them is recoverable from git history if wanted back.
#
# Process steps now carry `icon:` instead of `number:`. Names come from
# _includes/icon.html.
# ===========================================================================

# The hero no longer carries a price or a 'Check your date' button. The nav
# carries the CTA on every screen; someone who opened Process & Pricing came
# to understand the thing, and the button takes them straight to the money.
hero:
  label: Bold, Artful and sustainable floral design
  heading: Lake Tahoe Wedding Flowers
  subheading: We take on a limited number of weddings each season, so we can give
    yours more.
  button_primary: Jump to pricing

# Step 02 no longer says 'by call or studio visit'. Step 07 no longer says
# 'strike', which is event-industry jargon a couple will not know.
process:
  label: How it works
  heading: From first conversation to the end of the night.
  intro: Every step, in order, so you know what happens and when.
  steps:
  - icon: calendar
    phase: Before you book
    when: Today · no commitment
    title: Check your date
    body: Tell us your date and venue and we'll confirm it's still open. Availability
      is the first thing we check. It takes about a minute.
  - icon: moodboard
    when: Complimentary
    title: The consultation
    body: If your date is open, we sit down to learn your venue, vision, palette
      and guest count. It's free and there's no obligation; we both want to know
      it's the right fit.
  - icon: lock
    when: If we're a fit · held 7 days
    title: Proposal & a held date
    body: When it feels mutual, we build a custom proposal that includes a mood
      board, itemized estimate, and seasonal sourcing plan. We hold your date for
      7 days while you review, so you can decide without losing it.
  - icon: contract
    when: To lock it in
    title: Signed and secured
    body: A signed agreement and a non-refundable retainer, applied toward your
      balance, secure your date in full. From here, the date is officially yours.
  - icon: stem
    phase: Once you're booked
    when: 30–60 days out
    title: Refinement
    body: As your final count, layout, and timeline settle, we refine the design
      and lock your stem list around what's at peak that week. Your remaining balance
      is due 60 days before the wedding.
  - icon: van
    when: Wedding week & day
    title: Delivery, setup & install
    body: We source, gather, and design in the days before, then deliver, set, and
      install on-site, coordinating with your venue and planner so the timeline
      runs without you lifting a finger.
  - icon: cycle
    when: End of the night
    title: Repurposing and cleanup
    body: 'After the ceremony we can move pieces from the aisle to the reception,
      and at the end of the night our team comes back for the full breakdown: everything
      we brought is removed and the space is left clean.'

# Heading above the estimator. The tool itself is configured in
# _data/estimator.yml, which is where every dollar figure lives.
estimator_intro:
  label: Investment
  heading: What it costs.
  # "nothing is emailed" was not true: if they go on to check their date, the
  # estimate travels into the form's message. This version keeps the
  # reassurance and stops promising something the page itself breaks.
  body: Every wedding is quoted on its own, but the arithmetic is not a mystery.
    Move the sliders and see a planning range and where the money goes. Nothing
    here is saved, and nothing reaches us unless you decide to get in touch.

# Reviews are HIDDEN, not deleted. `show: false` stops the section rendering;
# the 13 quotes stay in _data/testimonials.yml and still feed the Review and
# aggregateRating JSON-LD in _layouts/redesign.html. Set show: true to bring
# the section back. NOTE: the home page's "Read more reviews" link points at
# /weddings#reviews and is hidden in step with this, so if you turn reviews
# back on, restore home.yml `testimonial.link` too.
testimonials:
  show: false
  label: What couples say
  heading: Loved by couples across the Sierra.

faq:
  label: Frequently asked questions
  heading: Everything else you might be wondering.

closing:
  label: Begin here
  heading: Is your date *still open?*
  body: Tell us your date and venue, and we'll let you know if it's open.
  button: Check your date
