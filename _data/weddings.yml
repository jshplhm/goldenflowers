    # back to bring the row back.
    labor:
      label: ""
      amount: 25% of the subtotal
  drivers_label: What moves the number
  drivers:
    - title: The venue
      body: A room you dress from bare walls and a lakeside lawn that needs one strong
        moment are different jobs, and they take different days to install.
    - title: Scope and design
      body: The ceremony on its own, or the ceremony and every table, bar and doorway
        on the way to it.
    - title: Guest count
      body: Tables set the floor of any reception number, so going from 80 guests to
        160 is felt here more than anywhere else.
    - title: The season
      body: What is at peak the week you marry is both the best value and the best
        looking. A flower flown in out of season costs more and travels worse.
    # The a la carte offer. It is written as an invitation to say a number, not
    # as a tier: naming a second figure here would put back the floor the rest of
    # the section just took out. Empty `smaller.body` and the whole panel stops
    # rendering, which is how the offer is withdrawn without touching markup.
  smaller:
    heading: If your budget is smaller
    # WITHDRAWN 2026-09-25 (Josh): with "Starting at $5,000" published, a note
    # addressed to smaller budgets invites exactly the weddings Brittany will
    # not take. Empty body = panel not rendered. The last wording was: "A
    # bigger wedding is more work, but the design, sourcing, delivery, setup
    # and breakdown behind it don't shrink much when a wedding gets smaller.
    # Below $5,000, that work takes up so much of the budget that too little
