# ===========================================================================
# WEDDINGS  ->  /weddings  (Process & Pricing)
#
# 2026-08-28: the floral estimator was moved OFF this page. It now lives at
# /pricing-tool, which is noindex + sitemap: false + unlinked, so it is
# Brittany's quoting tool rather than the site's pricing answer. The published
# three-figure ladder below took its place. See the `pricing:` block.
#
# 2026-08-15 (superseded): the ladder had been replaced BY the estimator.
# What that change took out and where it went:
#   - `included`   the six "what's included" cards. The four things we MAKE
#     became the icons heading the estimator's four input sections; the two
#     things we DO were always process steps and live there now. Still gone,
#     deliberately: the ladder came back, the cards did not.
#   - `assurance`  already unused before that change.
#   Both are recoverable from git history (see edaedfc) if wanted back.
#
# Process steps carry `icon:` instead of `number:`. Names come from
# _includes/icon.html.
# ===========================================================================

# The hero carries no price and no second button. The nav carries "Check your
# date" on every screen, so the hero's own button can serve the reason someone
# opened this page: it jumps to the ladder.
hero:
  label: Bold, Artful and sustainable floral design
  heading: Lake Tahoe Wedding Flowers
  subheading: We take on a limited number of weddings each season, so we can give
    yours more.
  button_primary: Jump to pricing

# Step 02 no longer says 'by call or studio visit'. Step 07 no longer says
# 'strike', which is event-industry jargon a couple will not know.
process:
  label: How it works
  heading: From first conversation to the end of the night.
  intro: Every step, in order, so you know what happens and when.
  steps:
  - icon: calendar
    phase: Before you book
    when: Today · no commitment
    title: Check your date
    body: Tell us your date and venue and we'll confirm it's still open. Availability
      is the first thing we check. It takes about a minute.
  - icon: moodboard
    when: Complimentary
    title: The consultation
    body: If your date is open, we sit down to learn your venue, vision, palette
      and guest count. It's free and there's no obligation; we both want to know
      it's the right fit.
  - icon: lock
    when: If we're a fit · held 7 days
    title: Proposal & a held date
    body: When it feels mutual, we build a custom proposal that includes a mood
      board, itemized estimate, and seasonal sourcing plan. We hold your date for
      7 days while you review, so you can decide without losing it.
  - icon: contract
    when: To lock it in
    title: Signed and secured
    body: A signed agreement and a non-refundable retainer, applied toward your
      balance, secure your date in full. From here, the date is officially yours.
  - icon: stem
    phase: Once you're booked
    when: 30–60 days out
    title: Refinement
    body: As your final count, layout, and timeline settle, we refine the design
      and lock your stem list around what's at peak that week. Your remaining balance
      is due 60 days before the wedding.
  - icon: van
    when: Wedding week & day
    title: Delivery, setup & install
    body: We source, gather, and design in the days before, then deliver, set, and
      install on-site, coordinating with your venue and planner so the timeline
      runs without you lifting a finger.
  - icon: cycle
    when: End of the night
    title: Repurposing and cleanup
    body: 'After the ceremony we can move pieces from the aisle to the reception,
      and at the end of the night our team comes back for the full breakdown: everything
      we brought is removed and the space is left clean.'

# THE PUBLISHED PRICE LADDER. Restored 2026-08-28 after the estimator was
# moved off this page to the internal-only /pricing-tool.
#
# Three figures, one label each. No cards and no feature lists: a card implies
# a package, and we are deliberately not saying what each figure buys.
#
# ONE published floor, and it is the full-service one. The $5,000 a la carte
# number is deliberately a subordinate line INSIDE the first tier rather than
# a tier of its own, because whichever figure gets a column of its own is read
# as what we are. Delete `entry_note` to withdraw the a la carte offer without
# touching the template.
#
# `lead: true` marks the tier most of our weddings land on. It is the visual
# peak of the row and the only one carrying a badge; setting it on more than
# one tier defeats the point.
#
# Claims here are about OUR book, never about the Lake Tahoe market: we have
# no data on what other studios charge, and "most couples spend X" also
# quietly grades the couple reading it.
#
# PHOTOS: attaching a photo to a figure implies that wedding cost roughly
# that, so these three are Brittany's to confirm. She can swap any of them
# from /edit (click the photo) or in Pages CMS. Paths are relative to
# assets/images/portfolio/; an upload from /edit stores a full site-root path
# instead and the template accepts both.
pricing:
  label: Investment
  # A SECTION, NOT A STRIP (2026-09-24, Josh).
  #
  # What this replaces: one figure, one caption and one paragraph, sitting on
  # the page's own ground between "what's included" and the FAQ. The nav calls
  # this page Pricing and that was the whole of the pricing on it.
  #
  # THE POSITION, in Josh's words: we are not stating a minimum budget in order
  # to work with someone. What we are saying is that the number varies with the
  # venue, the scope and the design, and that from the weddings we have done
  # around the lake we can tell a couple where a typical one lands. That is a
  # RANGE OBSERVED, not a floor charged, and the difference is the whole point:
  # a minimum is a door you can be under, a range is a place to stand.
  #
  # 2026-09-25: "THERE IS NO MINIMUM TO WORK WITH US" CAME OUT OF THE INTRO.
  # Not because the position changed, but because that sentence is a promise
  # the studio cannot keep in a conversation. Brittany, on a call or over
  # email, will tell a couple with a very small budget that it is not worth
  # doing, and the page had already told them there was no such line. Saying
  # nothing about minimums lets her have that conversation; saying "no
  # minimum" makes her contradict the website.
  #
  # The truth it was standing in for now lives in `smaller` below, where it
  # belongs: there is no rule that turns a wedding away, but design, sourcing,
  # delivery, setup and breakdown cost the same on a small order as on a large
  # one, so the smaller it gets the more of the money goes to that work
  # instead of to flowers. That is a value argument, not a door, and it is
  # what Brittany actually says. NO FIGURE IS NAMED for the same reason the
  # minimum came out: a published floor is a door, and we have taken four runs
  # at publishing one already (see the retired list above).
  #
  # Retired here, kept so the history is not lost:
  #   2026-09-24  "$12,000 to $18,000" / "A typical 100 guest wedding", one note
  #   2026-09-21  no figure at all
  #   2026-08-28  the three-tier ladder, $8,000 floor / $12-20k / $20,000+
  #   2026-09-15  one price, "$5,000 full service"
  #
  # `figures` is a list and the template follows it: two reads as the range and
  # the ceiling, one reads as the answer, three starts to read as a ladder
  # again, which is the shape we keep coming back off. Keep it at two.
  #
  # The FAQ "What does a full-service wedding florals investment typically look
  # like?" in _data/faqs.yml carries these same numbers. THEY HAVE TO AGREE.
  # They did not between 2026-09-21 and today: the FAQ was still saying
  # $10,000-$30,000+ and $12,000-$20,000 under a block saying $12,000-$18,000.
  heading: What it costs.
  intro: What a wedding costs moves with the venue, how much of the room you
    want designed, the season and your guest count, so every wedding is quoted
    on its own. What we can tell you is where the weddings we have done around
    the lake tend to land.
  figures:
  - amount: "$12,000 to $18,000"
    caption: Where a typical 100 guest full service wedding lands.
  - amount: Above $25,000
    caption: Larger guest counts, multiple installations, a room designed end
      to end.
  # Four things, because four is what a couple can hold. Each one is a lever
  # they actually control, so the list doubles as the agenda for the
  # consultation.
  drivers_label: What moves the number
  drivers:
  - title: The venue
    body: A room you dress from bare walls and a lakeside lawn that needs one
      strong moment are different jobs, and they take different days to install.
  - title: Scope and design
    body: The ceremony on its own, or the ceremony and every table, bar and
      doorway on the way to it.
  - title: Guest count
    body: Tables set the floor of any reception number, so going from 80 guests
      to 160 is felt here more than anywhere else.
  - title: The season
    body: What is at peak the week you marry is both the best value and the
      best looking. A flower flown in out of season costs more and travels
      worse.
  # The a la carte offer. It is written as an invitation to say a number, not
  # as a tier: naming a second figure here would put back the floor the rest of
  # the section just took out. Empty `smaller.body` and the whole panel stops
  # rendering, which is how the offer is withdrawn without touching markup.
  smaller:
    heading: If your budget is smaller
    body: We do our best to work with what a couple has, and we will be
      straight with you about what the money buys. A wedding takes the same
      design, sourcing, delivery, setup and breakdown whether the order is
      large or small, and none of that shrinks with the order. On a small full
      service wedding it ends up taking a bigger share than the flowers do,
      which is a poor trade for you. So if full service is more than you want
      to spend, tell us the number you had in mind and we will build an a la
      carte selection instead, a shorter list designed in your palette with
      the scope agreed up front. Fewer things, done properly, and more of your
      money in the flowers themselves.
    button: Tell us your budget

# What full-service covers. The six titles are what the /weddings FAQ already
# lists in one sentence ("consultation, design proposal and mood board,
# ceremony installation, bridal and party florals, reception centerpieces,
# environmental florals, and full day-of setup and breakdown"), broken out so
# they can be read rather than parsed.
#
# `body` is optional and blank on purpose: these titles are self-explanatory,
# and writing a paragraph for each would have put words in Brittany's mouth.
# Type one in (CMS or /edit) and it renders under its title.
included:
  label: What's included
  heading: Full-service means all of it.
  items:
    - title: Bridal & party florals
      body: ""
    - title: Ceremony installation
      body: ""
    - title: Reception centerpieces
      body: ""
    - title: Environmental florals
      body: ""
    - title: Setup & breakdown
      body: ""
    - title: Mood board & proposal
      body: ""

testimonials:
  show: false
  label: What couples say
  heading: Loved by couples across the Sierra.

faq:
  label: Frequently asked questions
  heading: Everything else you might be wondering.

closing:
  heading: Is your date *still open?*
  body: Tell us your date and venue, and we'll let you know if it's open.
  button: Check your date
