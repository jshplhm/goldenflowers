# Venues index page copy (goldenflorals.com/venues).
# The map and venue lists are part of the design and are not edited here.
# Tip: wrap words in *asterisks* to make them italic.

hero:
  label: Venues
  heading: We love this place.
  intro: From lakefront estates to mountaintop lodges, these are the venues Tahoe couples ask about most. Tap a featured venue for design notes, typical budgets, and planning answers.

# The line of links near the foot of every venue page. One label per area; the
# venue names fill themselves in.
nearby:
  north: More venues on the North Shore
  truckee: More venues around Truckee and Olympic Valley
  south: More venues on the South and West Shore
  all: All venues

# One sentence under that line, linking the home page in words. Three parts so
# the middle part can be the link: before + link + after.
who:
  north:
    before: Golden Flowers is a
    link: Lake Tahoe wedding florist
    after: " based in Incline Village, on the North Shore."
  truckee:
    before: Golden Flowers is a
    link: wedding florist for Lake Tahoe and Truckee
    after: ", with a studio in Incline Village."
  south:
    before: We're a
    link: Lake Tahoe wedding florist
    after: " working all the way around the lake, from Incline Village to the South Shore."

not_listed:
  label: Somewhere else?
  heading: Don't see your venue?
  body: The map covers the venues couples ask about most, and we range well beyond it, including private lakeside and mountain estates. We design across Lake Tahoe, Truckee, and the Sierra foothills, and we'll gladly walk a space that's new to us before we propose a single stem.
  link: Tell us where

closing:
  heading: Getting married at *one of these?*
  body: Tell us your date and venue, and we'll let you know if it's open.
  button: Check your date
