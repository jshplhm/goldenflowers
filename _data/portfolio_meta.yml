# Per-wedding facts for the portfolio index band and the wedding page panel.
#
#   slug    : folder name under assets/images/portfolio/
#   name    : the couple, as shown everywhere
#
# ORDER OF THIS LIST IS THE ORDER ON THE PAGE. The 01..NN numbering and the
# band width rotation both follow from it, so moving an entry is enough.
#   venue   : shown in the band rule and the page's fact panel
#   place   : town or region
#   band    : the three photos on the desktop band, in markup order
#             (landscape-tolerant first, then hero, then detail) — see the
#             width-rotation note in redesign.css
#   strip   : two EXTRA photos. Three on the band plus these two makes a
#             fixed five to swipe through on a phone.
#   lede    : one or two sentences on the index band
#   palette : named stems, shown in the fact panel
#   dots    : swatches sampled from the real arrangements
#
# Story prose lives in _data/portfolio.yml (unchanged). Vendor credits live in
# _data/credits.yml.

- slug: lynn-aaron
  name: "Lynn & Aaron"
  venue: "Palisades High Camp"
  place: "Olympic Valley"
  band: [ "21", "27", "08" ]
  strip: [ "19", "17" ]
  lede: "A wedding at the top of the mountain, with snow still on the peaks. We
    met the setting with jewel tones and installations scaled for a landscape
    that big."
  palette: "Coral peony, oxblood dahlia, trailing amaranthus"
  dots: [ "#e8756a", "#5c1f2b", "#8fae5d", "#f0e3d2", "#b8365a" ]

- slug: tori-tucker
  name: "Tori & Tucker"
  venue: "North Tahoe Event Center"
  place: "Kings Beach"
  band: [ "13", "18", "03" ]
  strip: [ "05", "08" ]
  lede: "Pink, green and a little bit whimsical, on the shore of the lake. Garden
    roses and sweet peas against sage linen, styled with an editorial eye."
  palette: "Garden rose, coral peony, sweet pea, hydrangea, sage"
  dots: [ "#e8a3ae", "#f2c9b4", "#8f9b6f", "#f6efe4", "#c56a7a" ]

- slug: katie-james
  name: "Katie & James"
