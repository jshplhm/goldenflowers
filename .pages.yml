# Pages CMS config (pagescms.org): a hosted, modern, self-serve editor.
# Brittany signs in at app.pagescms.org with GitHub (one-time), picks this repo,
# and gets a clean UI to write blog posts and build client proposals.
# No Netlify / serverless backend required.

media:
  - name: blog
    input: assets/images/blog
    output: /goldenflowers/assets/images/blog
  - name: proposals
    input: assets/images/proposals
    output: /goldenflowers/assets/images/proposals

content:
  # ═══════════════════════════════════════════════════════════════════
  #  SITE COPY
  #  Every page's words live here. Pick a page, edit the text boxes,
  #  press Save, and the live site updates in a minute or two.
  #  Tip anywhere you see it: put *asterisks* around words to italicize.
  # ═══════════════════════════════════════════════════════════════════

  - name: home
    label: Home page
    type: file
    path: _data/home.yml
    format: yaml
    icon: house
    fields:
      - name: hero
        label: Hero (very top)
        type: object
        fields:
          - {name: eyebrow, label: "Small label above the headline", type: string}
          - {name: heading, label: "Headline", type: string, description: "Put *asterisks* around words to italicize them."}
          - {name: subheading, label: "Sub-headline", type: text}
          - {name: button, label: "Button text", type: string}
      - name: intro
        label: Intro band
        type: object
        fields:
          - {name: paragraph1, label: "First paragraph", type: text}
          - {name: paragraph2, label: "Second paragraph", type: text}
      - name: why
        label: Why Golden Flowers
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - name: facts
            label: The three facts
            type: object
            list: true
            fields:
              - {name: number, label: "Number (e.g. 01)", type: string}
              - {name: title, label: "Title", type: string}
              - {name: body, label: "Text", type: text}
      - name: work
        label: Selected weddings
        type: object
        fields:
          - {name: heading, label: "Heading", type: string}
          - {name: link, label: "Link text", type: string}
      - name: marquee
        label: Scrolling venue strip
        type: object
        fields:
          - {name: label, label: "Label", type: string}
          - {name: link, label: "Link text", type: string}
      - name: immersive
        label: Full-width photo band
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Text over the photo", type: string}
      - name: aesthetics
        label: Three design languages
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - name: cards
            label: The three cards
            type: object
            list: true
            fields:
              - {name: title, label: "Title", type: string}
              - {name: body, label: "Text", type: text}
              - {name: link, label: "Link text", type: string}
      - name: testimonial
        label: Featured review
        type: object
        fields:
          - {name: quote, label: "Quote", type: text, description: "*asterisks* = italics"}
          - {name: name, label: "Name", type: string}
          - {name: context, label: "Context (e.g. Lake Tahoe Wedding)", type: string}
          - {name: link, label: "Link text", type: string}
      - name: cta
        label: Closing call to action
        type: object
        fields:
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - {name: body, label: "Text", type: text}
          - {name: button, label: "Button text", type: string}

