# Pages CMS config (pagescms.org) — a hosted, modern, self-serve editor.
# Brittany signs in at app.pagescms.org with GitHub (one-time), picks this repo,
# and gets a clean UI to write blog posts and build client proposals.
# No Netlify / serverless backend required.

media:
  - name: blog
    input: assets/images/blog
    output: /goldenflowers/assets/images/blog
  - name: proposals
    input: assets/images/proposals
    output: /goldenflowers/assets/images/proposals

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        label: Layout
        type: string
        default: post
        hidden: true
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: featured_image
        label: Featured Image
        type: image
        options:
          media: blog
      - name: description
        label: Description (1 to 2 sentences for search & social previews)
        type: text
      - name: body
        label: Body
        type: rich-text

  # ── Client Proposals ─────────────────────────────────────────────
  # New Proposal → fill the fields → Save. Pages CMS commits a page at
  # p/<URL slug>/index.md and GitHub Pages publishes it in ~1–2 min.
  # Send the couple the link + access code. Nothing here is indexed by
  # search engines (robots.txt disallows /p/ and each page is noindex).
  - name: proposals
    label: Client Proposals
    type: collection
    path: p
    filename: '{fields.urlSlug}/index.md'
    view:
      fields: [coupleNames, weddingDate, venue]
    fields:
      - name: layout
        label: Layout
        type: string
        default: proposal
        hidden: true
      - name: sitemap
        label: Sitemap
        type: boolean
        default: false
        hidden: true

      - name: urlSlug
        label: URL slug (add random characters — this is the real privacy)
        description: 'e.g. brittany-chase-7f3a9b — the page lives at /p/<slug>/'
        type: string
        required: true
        pattern: '^[a-z0-9-]+$'
      - name: accessCode
        label: Access code (what the couple types to unlock)
        type: string
        required: true

      - name: coupleNames
        label: Couple names
        description: 'e.g. Brittany & Chase'
        type: string
        required: true
      - name: weddingDate
        label: Wedding date (as you want it shown)
        description: 'e.g. July 17, 2027'
        type: string
        required: true
      - name: venue
        label: Venue
        type: string
      - name: designLanguage
        label: Design language
        type: select
        options:
          values: ['Lush & Romantic', 'Elevated Minimalist', 'Wildflower Modern']
      - name: visionStatement
        label: Vision statement (the airy/abundant paragraph for the dark band)
        type: text

      - name: note
        label: A personal note from you (optional)
        type: text
      - name: noteSignature
        label: Note signature
        type: string
        default: Brittany

      - name: dateSent
        label: Date sent (YYYY-MM-DD) — the hold runs 5 days from this
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      - name: depositAmount
        label: Retainer amount (shown as-is)
        description: 'e.g. $1,500'
        type: string
        default: '$1,000'
      - name: depositLink
        label: Reserve button link (QuickBooks deposit invoice URL — optional)
        description: 'Leave blank to fall back to an email to brittany@goldenflorals.com'
        type: string
      - name: venmo
        label: Venmo handle (optional)
        type: string
      - name: zelle
        label: Zelle email/phone (optional)
        type: string

      - name: estimateTotal
        label: Estimated investment (range, shown as-is)
        description: 'e.g. $9,500–11,000 — leave blank to hide the estimate section'
        type: string
      - name: estimate
        label: Estimate line items
        type: object
        list: true
        fields:
          - name: item
            label: Item
            type: string
          - name: price
            label: Price
            type: string

      - name: heroImage
        label: Cover hero image
        type: image
        options:
          media: proposals
      - name: portraitImage
        label: About / portrait image
        type: image
        options:
          media: proposals
      - name: moodboard
        label: Moodboard images (first is the large hero tile)
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            options:
              media: proposals
          - name: label
            label: Caption
            type: string
      - name: swatches
        label: Color palette (leave empty to use the default warm palette)
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: hex
            label: Hex color
            type: string
            pattern: '^#?[0-9a-fA-F]{3,8}$'
      - name: flowers
        label: Flower / stem names
        type: string
        list: true
