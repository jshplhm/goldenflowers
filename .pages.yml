  # ── Page FAQs ────────────────────────────────────────────────────
  # Edits the FAQ accordions on the venue pages + the Weddings page. These
  # render as both the visible Q&A and FAQPage structured data (for Google /
  # AI answer engines) from _data/faqs.yml. Pick a page, edit its questions.
  # The `url` matches the FAQs to a page. Leave it alone.
  - name: faqs
    label: Page FAQs
    type: file
    path: _data/faqs.yml
    format: yaml
    fields:
      - name: pages
        label: Pages
        type: object
        list: true
        fields:
          - name: label
            label: Page
            type: string
          - name: url
            label: Page address (do not change)
            type: string
          - name: faqs
            label: Questions
            type: object
            list: true
            fields:
              - name: q
                label: Question
                type: string
              - name: a
                label: Answer (basic HTML like <strong> and <br> is allowed)
                type: text

  - name: blog_page
    label: Blog page
    type: file
    path: _data/blog_page.yml
    format: yaml
    icon: newspaper
    fields:
      - name: hero
        label: Hero (very top)
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Headline", type: string, description: "*asterisks* = italics"}
          - {name: subheading, label: "Sub-headline", type: text}
      - name: cta
        label: Bottom call-to-action
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - {name: body, label: "Text", type: text}
          - {name: button, label: "Button text", type: string}
      - name: post_cta
        label: Call-to-action at the bottom of every post
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - {name: body, label: "Text", type: text}
          - {name: button, label: "Button text", type: string}

  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        label: Layout
        type: string
        default: post
        hidden: true
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: featured_image
        label: Featured Image
        type: image
        options:
          media: blog
      - name: description
        label: Description (1 to 2 sentences for search & social previews)
        type: text
      - name: body
        label: Body
        type: rich-text

  # ── Client Proposals ─────────────────────────────────────────────
  # New Proposal → fill the fields → Save. Pages CMS commits a page at
  # p/<URL slug>/index.md and GitHub Pages publishes it in ~1–2 min.
  # Send the couple the link + access code. Nothing here is indexed by
  # search engines (robots.txt disallows /p/ and each page is noindex).
  - name: proposals
    label: Client Proposals
    type: collection
    path: p
    filename: '{fields.urlSlug}/index.md'
    view:
      fields: [coupleNames, weddingDate, venue]
    fields:
      - name: layout
        label: Layout
        type: string
        default: proposal
        hidden: true
      - name: sitemap
        label: Sitemap
        type: boolean
        default: false
        hidden: true

      - name: urlSlug
        label: URL slug (add random characters; this is the real privacy)
        description: 'e.g. brittany-chase-7f3a9b. The page lives at /p/<slug>/'
        type: string
        required: true
        pattern: '^[a-z0-9-]+$'
      - name: accessCode
        label: Access code (what the couple types to unlock)
        type: string
        required: true

      - name: coupleNames
        label: Couple names
        description: 'e.g. Brittany & Chase'
        type: string
        required: true
      - name: weddingDate
        label: Wedding date (as you want it shown)
        description: 'e.g. July 17, 2027'
        type: string
        required: true
      - name: venue
        label: Venue
        type: string
      - name: designLanguage
        label: Design language
        type: select
        options:
          values: ['Lush & Romantic', 'Elevated Minimalist', 'Wildflower Modern']
      - name: visionStatement
        label: Vision statement (the airy/abundant paragraph for the dark band)
        type: text

      - name: note
        label: A personal note from you (optional)
        type: text
      - name: noteSignature
        label: Note signature
        type: string
        default: Brittany

      - name: dateSent
        label: Date sent (YYYY-MM-DD). The hold runs 7 days from this
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      - name: depositAmount
        label: Retainer amount (shown as-is)
        description: 'e.g. $1,500'
        type: string
        default: '$1,000'
      - name: depositLink
        label: Reserve button link (QuickBooks deposit invoice URL, optional)
        description: 'Leave blank to fall back to an email to brittany@goldenflorals.com'
        type: string
      - name: venmo
        label: Venmo handle (optional)
        type: string
      - name: zelle
        label: Zelle email/phone (optional)
        type: string
      - name: paymentNote
        label: Payment note (how the retainer & balance are paid)
        description: 'Shown under the Reserve buttons. Steers couples to bank transfer without surcharging cards (NV restricts card surcharges).'
        type: text
        default: "Your retainer and balance are invoiced through QuickBooks. We're glad to take bank transfer, check, Venmo, Zelle, or card. Bank transfer is quickest and our preferred method."

      - name: estimateTotal
        label: Estimated investment (optional check figure)
        description: 'Optional. Subtotals and the total are computed from the line amounts automatically. Fill this only to show a small check figure beside the total while verifying.'
        type: string
      - name: taxNote
        label: Tax note (shown under the estimate total)
        type: string
        default: 'Sales tax is added to the florals at the local rate on your final invoice.'
      - name: estimateGroups
        label: Estimate sections (e.g. Personal / Ceremony / Reception). The estimate section shows when this has at least one group.
        type: object
        list: true
        fields:
          - name: title
            label: Section title
            type: string
          - name: items
            label: Line items
            type: object
            list: true
            fields:
              - name: item
                label: Item
                type: string
              - name: detail
                label: 'For multiples: "N × $low–high" (e.g. 4 × $125–175). Leave blank for single items.'
                type: string
              - name: amount
                label: 'Line total. For multiples = N × the unit price (e.g. 4 × $150 = $600)'
                type: string

      - name: heroImage
        label: Cover hero image
        type: image
        options:
          media: proposals
      - name: portraitImage
        label: About / portrait image
        type: image
        options:
          media: proposals
      - name: moodboard
        label: Moodboard images (first is the large hero tile)
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            options:
              media: proposals
          - name: label
            label: Caption
            type: string
      - name: swatches
        label: Color palette (leave empty to use the default warm palette)
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: hex
            label: Hex color
            type: string
            pattern: '^#?[0-9a-fA-F]{3,8}$'
      - name: flowers
        label: Flower / stem names
        type: string
        list: true
