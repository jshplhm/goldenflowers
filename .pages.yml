      - name: pricing
        label: "Section: investment"
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - {name: range, label: "Price range", type: string}
          - {name: note, label: "Under the price", type: string}
          - {name: details, label: "Paragraphs", type: text, list: true}
          - {name: button, label: "Button text", type: string}
      - name: cta
        label: Closing call to action
        type: object
        fields:
