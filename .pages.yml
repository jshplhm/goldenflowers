  # ── Page FAQs ────────────────────────────────────────────────────
  # Edits the FAQ accordions on the venue pages + the Weddings page. These
  # render as both the visible Q&A and FAQPage structured data (for Google /
  # AI answer engines) from _data/faqs.yml. Pick a page, edit its questions.
  # The `url` matches the FAQs to a page. Leave it alone.
  - name: faqs
    label: Page FAQs
    type: file
    path: _data/faqs.yml
    format: yaml
    fields:
      - name: pages
        label: Pages
        type: object
        list: true
        fields:
          - name: label
            label: Page
            type: string
          - name: url
            label: Page address (do not change)
            type: string
          - name: faqs
            label: Questions
            type: object
            list: true
            fields:
              - name: q
                label: Question
                type: string
              - name: a
                label: Answer (basic HTML like <strong> and <br> is allowed)
                type: text

  - name: blog_page
    label: Blog page
    type: file
    path: _data/blog_page.yml
    format: yaml
    icon: newspaper
    fields:
      - name: hero
        label: Hero (very top)
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Headline", type: string, description: "*asterisks* = italics"}
          - {name: subheading, label: "Sub-headline", type: text}
      - name: cta
        label: Bottom call-to-action
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - {name: body, label: "Text", type: text}
          - {name: button, label: "Button text", type: string}
      - name: post_cta
        label: Call-to-action at the bottom of every post
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - {name: body, label: "Text", type: text}
          - {name: button, label: "Button text", type: string}

  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        label: Layout
        type: string
        default: post
        hidden: true
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: featured_image
        label: Featured Image
        type: image
        options:
          media: blog
      - name: description
        label: Description (1 to 2 sentences for search & social previews)
        type: text
      - name: body
        label: Body
        type: rich-text


  # ═══════════════════════════════════════════════════════════════════
  #  PRICING ENGINE (the internal tool at /pricing-tool)
  #  The numbers behind the floral planning estimator. Nothing here is
  #  shown to a visitor as a unit price; the tool only ever renders
  #  whole-category ranges and shares.
  #
  #  NOTE: Pages CMS strips YAML comments on save, and _data/estimator.yml
  #  is heavily commented. The guidance that matters is repeated in the
  #  `description` fields below so it survives the first save.
  # ═══════════════════════════════════════════════════════════════════

  - name: estimator
    label: Estimator prices
    type: file
    path: _data/estimator.yml
    format: yaml
    icon: calculator
    description: "Every number behind the internal pricing tool at /pricing-tool. Low and high are dollars; always keep low at or below high. Prices here are never shown as unit prices."
    fields:
      - name: settings
        label: How the math works
        type: object
        fields:
          - {name: minimum, label: "Full-service minimum", type: number, description: "Anything that prices out below this stops showing a figure and offers the smaller-scope path instead."}
          - {name: guests_per_table, label: "Guests per reception table", type: number, description: "Turns the guest slider into a table count."}
          - {name: round_to, label: "Round the headline range to", type: number, description: "Dollars. 250 means the range always ends in 000, 250, 500 or 750."}
          - {name: category_round, label: "Round the breakdown rows to", type: number}
          - {name: band_tighten, label: "Tighten the range", type: number, description: "0 shows the full raw spread, which is usually about 2x and too wide to plan against. 0.35 is a good middle. 0.5 collapses it to a single number."}
          - name: service
            label: "Delivery, setup and strike"
            type: object
            fields:
              - {name: low_pct, label: "Low end (% of the design subtotal)", type: number}
              - {name: high_pct, label: "High end (% of the design subtotal)", type: number}
              - {name: floor, label: "Never less than ($)", type: number}
      - name: sliders
        label: Sliders
        type: object
        fields:
          - name: guests
            label: Guest count
            type: object
            fields:
              - {name: label, label: "Label", type: string}
              - {name: min, label: "Lowest", type: number}
              - {name: max, label: "Highest", type: number}
              - {name: step, label: "Moves in steps of", type: number}
              - {name: default, label: "Starts at", type: number}
              - {name: suffix, label: "Word after the number", type: string}
              - {name: max_suffix, label: "Word at the top of the slider", type: string}
      - name: personal
        label: Personal florals
        type: object
        fields:
          - {name: label, label: "Category name in the breakdown", type: string}
          - name: bridal_bouquet
            label: Bridal bouquet
            type: object
            fields: [{name: low, label: Low, type: number}, {name: high, label: High, type: number}]
          - name: party
            label: Wedding party
            type: object
            fields:
              - {name: label, label: "Question", type: string}
              - {name: help, label: "Help text", type: text}
              - name: options
                label: Sizes
                type: object
                list: true
                description: "Whole ranges for the whole party, NOT a price each. This replaced a headcount slider that multiplied a bridesmaid bouquet price by the number of bridesmaids: sizes keep any single bouquet or boutonniere from having a published price a couple could work out and then cut. Retune these four freely, there is no headcount they have to stay consistent with."
                fields:
                  - {name: key, label: "Key (do not change)", type: string}
                  - {name: label, label: "Button text", type: string}
                  - {name: note, label: "Small print", type: text}
                  - {name: recap, label: "How it reads in the consultation form", type: string, description: "A phrase, not a button label: it appears after 'Wedding party:' in the recap Brittany receives."}
                  - {name: low, label: Low, type: number}
                  - {name: high, label: High, type: number}
          - name: family
            label: "Flowers for family (one bundle, not per person)"
            type: object
            fields:
              - {name: label, label: "Button text", type: string}
              - {name: note, label: "Small print", type: text}
              - {name: low, label: Low, type: number}
              - {name: high, label: High, type: number}
          - name: flower_kids
            label: Flower girl or ring bearer
            type: object
            fields:
              - {name: label, label: "Button text", type: string}
              - {name: note, label: "Small print", type: text}
              - {name: low, label: Low, type: number}
              - {name: high, label: High, type: number}
      - name: ceremony
        label: Ceremony
        type: object
        fields:
          - {name: label, label: "Category name in the breakdown", type: string}
          - name: focal
            label: "The piece you stand under"
            type: object
            fields:
              - {name: label, label: "Question", type: string}
              - {name: help, label: "Help text", type: text}
              - name: options
                label: Choices
                type: object
                list: true
                description: "Deleting a choice removes its button from the page. Leave the key alone."
                fields:
                  - {name: key, label: "Key (do not change)", type: string}
                  - {name: label, label: "Button text", type: string}
                  - {name: note, label: "Small print", type: text}
                  - {name: low, label: Low, type: number}
                  - {name: high, label: High, type: number}
          - name: ground
            label: "Aisle and ground florals"
            type: object
            fields:
              - {name: label, label: "Question", type: string}
              - name: options
                label: Choices
                type: object
                list: true
                fields:
                  - {name: key, label: "Key (do not change)", type: string}
                  - {name: label, label: "Button text", type: string}
                  - {name: note, label: "Small print", type: text}
                  - {name: low, label: Low, type: number}
                  - {name: high, label: High, type: number}
      - name: reception
        label: Reception tables
        type: object
        fields:
          - {name: label, label: "Category name in the breakdown", type: string}
          - name: style
            label: Guest tables
            type: object
            fields:
              - {name: label, label: "Question", type: string}
              - {name: help, label: "Help text", type: text}
              - name: options
                label: Choices
                type: object
                list: true
                description: "Low and high here are PER TABLE. The tool multiplies by the table count."
                fields:
                  - {name: key, label: "Key (do not change)", type: string}
                  - {name: label, label: "Button text", type: string}
                  - {name: note, label: "Small print", type: text}
                  - {name: low, label: "Low (per table)", type: number}
                  - {name: high, label: "High (per table)", type: number}
          - name: head_table
            label: Head or sweetheart table
            type: object
            fields:
              - {name: label, label: "Button text", type: string}
              - {name: note, label: "Small print", type: text}
              - {name: low, label: Low, type: number}
              - {name: high, label: High, type: number}
      - name: environmental
        label: Environmental
        type: object
        fields:
          - {name: label, label: "Category name in the breakdown", type: string}
          - {name: help, label: "Help text", type: text}
          - name: options
            label: Choices
            type: object
            list: true
            description: "Each of these is a pill the couple can tap on or off."
            fields:
              - {name: key, label: "Key (do not change)", type: string}
              - {name: label, label: "Pill text", type: string}
              - {name: low, label: Low, type: number}
              - {name: high, label: High, type: number}
      - name: categories
        label: Breakdown rows
        type: object
        list: true
        description: "The order of the slices in the bar and the rows under it. Keys must stay as they are."
        fields:
          - {name: key, label: "Key (do not change)", type: string}
          - {name: label, label: "Row name", type: string}
      - name: copy
        label: Wording on the page
        type: object
        fields:
          - {name: eyebrow, label: "Small label above the headline", type: string}
          - {name: heading, label: "Headline", type: string}
          - {name: lede, label: "Opening paragraph", type: text}
          - {name: disclaimer, label: "Not-a-quote note", type: text}
          - {name: result_label, label: "Label above the range", type: string}
          - {name: result_caption_prefix, label: "Caption under the range starts with", type: string}
          - {name: allocation_label, label: "Label above the breakdown", type: string}
          - {name: cta_button, label: "Button text", type: string}
          - {name: cta_note, label: "Note under the button", type: text}
          - name: handoff
            label: "The recap carried into the consultation form"
            type: object
            description: "Tapping the button opens the form with a read-only summary of what was picked here. These are the row labels only; every answer beside them is worked out by the tool."
            fields:
              - {name: heading, label: "Small label above the recap", type: string}
              - {name: note, label: "Note under the recap", type: text, description: "Explains why the rows cannot be typed in."}
              - {name: adjust, label: "Button back to the tool", type: string}
              - {name: guests, label: "Row label: guests", type: string}
              - {name: party, label: "Row label: wedding party", type: string}
              - {name: personal, label: "Row label: family florals", type: string}
              - {name: ceremony, label: "Row label: ceremony", type: string}
              - {name: tables, label: "Row label: guest tables", type: string}
              - {name: reception, label: "Row label: reception installation", type: string}
              - {name: environmental, label: "Row label: other areas", type: string}
              - {name: range, label: "Row label: the range", type: string}
              - {name: under_min, label: "Range row when it lands under the minimum", type: string}
          - {name: under_min_label, label: "Under-minimum: small label", type: string}
          - {name: under_min_heading, label: "Under-minimum: headline", type: string}
          - {name: under_min_body, label: "Under-minimum: paragraph", type: text}
          - {name: under_min_cta, label: "Under-minimum: button text", type: string}
          - {name: notes_label, label: "Bottom section: small label", type: string}
          - {name: notes_heading, label: "Bottom section: headline", type: string}
          - name: notes
            label: "Bottom section: the four points"
            type: object
            list: true
            fields:
              - {name: title, label: Title, type: string}
              - {name: body, label: Body, type: text}
