        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - {name: paragraph, label: "Paragraph", type: text}
          - {name: kicker, label: "Highlighted line", type: text}
      - name: team
        label: "Section: the team"
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - {name: paragraphs, label: "Paragraphs", type: text, list: true}
      - name: certainty
        label: "Section: buying certainty"
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - {name: paragraphs, label: "Paragraphs", type: text, list: true}
          - name: points
            label: The four points
            type: object
            list: true
            fields:
              - {name: title, label: "Title", type: string}
              - {name: body, label: "Text", type: text}
      - name: editorial
