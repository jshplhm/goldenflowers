        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - {name: intro, label: "Intro line", type: text}
          - name: seasons
            label: The four seasons
            type: object
            list: true
            fields:
              - {name: name, label: "Season name", type: string}
              - {name: dates, label: "Dates", type: string}
              - {name: flowers, label: "Flowers in season", type: string, list: true}
              - {name: note, label: "Note", type: text}
          - {name: footnote, label: "Footnote", type: text}
      - name: values
        label: "Section: philosophy"
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - name: items
            label: The principles
            type: object
            list: true
            fields:
              - {name: title, label: "Title", type: string}
              - {name: body, label: "Text", type: text}
      - name: sustainability_pointer
        label: "Section: sustainability pointer"
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - {name: body, label: "Text", type: text}
          - {name: link, label: "Link text", type: string}
      - name: closing
        label: Closing call to action
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - {name: body, label: "Text", type: text}
          - {name: button, label: "Button text", type: string}

  - name: weddings
    label: Weddings page
    type: file
    path: _data/weddings.yml
    format: yaml
    icon: flower-2
    fields:
      - name: hero
        label: Hero (top)
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Headline", type: string, description: "*asterisks* = italics"}
          - {name: subheading, label: "Sub-headline", type: text}
          - {name: button_primary, label: "Main button text", type: string, description: "Jumps down to the pricing estimator."}
      - name: process
        label: "Section: how it works"
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - {name: intro, label: "Intro paragraph", type: text}
          - name: steps
            label: The steps
            type: object
            list: true
            fields:
              - {name: icon, label: "Icon", type: string, description: "Name of a line icon: calendar, moodboard, lock, contract, stem, van, cycle. Also available: bouquet, arch, compote, budvase, ladder, pencil, checklist."}
              - {name: phase, label: "Start a new group here", type: string, description: "Leave blank on most steps. Fill it in to start a new group, e.g. 'Before you book'. The heading shows above that step."}
              - {name: when, label: "Timing label", type: string}
              - {name: title, label: "Title", type: string}
              - {name: body, label: "Text", type: text}
      - name: pricing
        label: "Section: investment (the three prices)"
        type: object
        description: "The price ladder on the dark band. To change a PHOTO, open /edit, go to the Process & Pricing page and click the photo you want to swap: photos are not editable here."
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
          - {name: note, label: "Line under the heading", type: text}
          - name: tiers
            label: "The three prices"
            type: object
            list: true
            description: "Three rows, cheapest first. Tick 'Where most weddings land' on exactly ONE row, and give that same row a badge: it is the highlighted middle of the scale, and ticking two defeats the point. Every figure is typed exactly as it should read, dollar sign and all."
            fields:
              - {name: amount, label: "Amount", type: string}
              - {name: label, label: "What it covers", type: string}
              - {name: badge, label: "Badge on the photo", type: string, description: "Short, two or three words. Leave empty on the rows that are not the highlighted one."}
              - {name: lead, label: "Where most weddings land", type: boolean, description: "The highlighted row. Exactly one."}
              - {name: entry_note, label: "Smaller-scope line", type: text, description: "The a la carte offer, shown as a quieter line inside this row only. Empty it to withdraw the offer and the line disappears on its own."}
              - {name: alt, label: "Photo description", type: text, description: "Read aloud to anyone using a screen reader, and shown if the photo fails to load. Describe what is in the picture."}
      - name: testimonials
        label: "Section: reviews"
        type: object
        fields:
          - {name: show, label: "Show the reviews section", type: boolean, description: "Off. The reviews themselves are kept under 'Reviews (carousel)' and still feed search-engine markup. Turning this on also means restoring the home page's 'Read more reviews' link."}
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
      - name: faq
        label: "Section: FAQ heading"
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string}
      - name: closing
        label: Closing call to action
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - {name: body, label: "Text", type: text}
          - {name: button, label: "Button text", type: string}

