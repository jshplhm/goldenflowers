  # ── Page FAQs ────────────────────────────────────────────────────
  # Edits the FAQ accordions on the venue pages + the Weddings page. These
  # render as both the visible Q&A and FAQPage structured data (for Google /
  # AI answer engines) from _data/faqs.yml. Pick a page, edit its questions.
  # The `url` matches the FAQs to a page. Leave it alone.
  - name: faqs
    label: Page FAQs
    type: file
    path: _data/faqs.yml
    format: yaml
    fields:
      - name: pages
        label: Pages
        type: object
        list: true
        fields:
          - name: label
            label: Page
            type: string
          - name: url
            label: Page address (do not change)
            type: string
          - name: faqs
            label: Questions
            type: object
            list: true
            fields:
              - name: q
                label: Question
                type: string
              - name: a
                label: Answer (basic HTML like <strong> and <br> is allowed)
                type: text

  - name: blog_page
    label: Blog page
    type: file
    path: _data/blog_page.yml
    format: yaml
    icon: newspaper
    fields:
      - name: hero
        label: Hero (very top)
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Headline", type: string, description: "*asterisks* = italics"}
          - {name: subheading, label: "Sub-headline", type: text}
      - name: cta
        label: Bottom call-to-action
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - {name: body, label: "Text", type: text}
          - {name: button, label: "Button text", type: string}
      - name: post_cta
        label: Call-to-action at the bottom of every post
        type: object
        fields:
          - {name: label, label: "Small label", type: string}
          - {name: heading, label: "Heading", type: string, description: "*asterisks* = italics"}
          - {name: body, label: "Text", type: text}
          - {name: button, label: "Button text", type: string}

  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      fields: [title, date]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        label: Layout
        type: string
        default: post
        hidden: true
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: featured_image
        label: Featured Image
        type: image
        options:
          media: blog
      - name: description
        label: Description (1 to 2 sentences for search & social previews)
        type: text
      - name: body
        label: Body
        type: rich-text

