backend:
  name: github
  repo: jshplhm/goldenflowers
  branch: main
  auth_type: pkce
  app_id: Ov23li30OHE4IrMTgS9F

media_folder: assets/images/blog
public_folder: /goldenflowers/assets/images/blog

collections:
  - name: posts
    label: Blog Posts
    label_singular: Blog Post
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: Layout
        name: layout
        widget: hidden
        default: post
      - label: Title
        name: title
        widget: string
      - label: Publish Date
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        default: ""
      - label: Featured Image
        name: featured_image
        widget: image
        required: false
        hint: "The main photo shown at the top of the post"
      - label: Description
        name: description
        widget: string
        required: false
        hint: "1–2 sentences for search results and social previews"
      - label: Body
        name: body
        widget: markdown
