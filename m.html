<!doctype html><meta charset=utf-8><body><pre id=out>PENDING</pre>
<iframe id=f src="/" style="width:390px;height:800px;border:0;position:absolute;left:-9999px"></iframe>
<script>
document.getElementById('f').onload=function(){
  var d=this.contentDocument, W=this.contentWindow;
  var els=[].slice.call(d.querySelectorAll('.hero-top, .pband, .credo, .testi'));
  var rows=[];
  els.forEach(function(e){
    var pics=[].slice.call(e.querySelectorAll('.pb-pic, .ht-pic'));
    if(pics.length){ pics.forEach(function(p){ rows.push({t:'pic', r:p.getBoundingClientRect()}); }); }
    else rows.push({t:e.className.split(' ')[0]+'(text)', r:e.getBoundingClientRect()});
  });
  var out=[];
  for(var i=1;i<rows.length;i++){
    var gap=Math.round(rows[i].r.top + W.pageYOffset - (rows[i-1].r.bottom + W.pageYOffset));
    out.push(rows[i-1].t+' -> '+rows[i].t+' : '+gap);
  }
  document.getElementById('out').textContent=out.join('\n');
};
</script>
