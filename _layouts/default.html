<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} · Golden Flowers{% else %}Lake Tahoe Wedding Florist | Golden Flowers{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v=25">
  
  {% seo %}
</head>
<body>

{% include header.html %}

{{ content }}

{% include footer.html %}

<div class="sticky-cta">
  <div class="sticky-cta-text">
    <strong>One wedding per date</strong>
    <span>Summer 2026 filling</span>
  </div>
  <a href="{{ site.baseurl }}/weddings#consultation" data-consult-open>Check your date &rarr;</a>
</div>

{% include consult-modal.html %}

<script>
// ── Consultation modal (lightbox CTAs) ─────────────────
(function() {
  const modal = document.getElementById('consult-modal');
  if (!modal) return;
  let lastFocus = null;
  function open(e) {
    lastFocus = document.activeElement;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    const first = modal.querySelector('input, select, textarea, button');
    if (first) setTimeout(function() { first.focus(); }, 60);
  }
  function close() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    if (lastFocus) lastFocus.focus();
  }
  // If the current page already has an inline consultation form, scroll to it
  // instead of opening the modal (avoids a modal-over-form redundancy).
  const inlineForm = document.querySelector('.form-section form, #consultation form');
  document.addEventListener('click', function(e) {
    const trigger = e.target.closest('a[href*="#consultation"]:not([href*="consultation-success"]), [data-consult-open]');
    if (trigger) {
      // data-consult-open always opens the modal (hero / sticky bar / menu).
      // Plain #consultation links scroll to an on-page form when one exists.
      const forceModal = trigger.hasAttribute('data-consult-open');
      if (inlineForm && !forceModal) {
        const target = document.getElementById('consultation') || inlineForm.closest('section');
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); }
        return;
      }
      e.preventDefault(); open(); return;
    }
    if (e.target === modal || e.target.closest('[data-consult-close]')) { close(); }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) close();
  });
})();

// ── Sticky mobile CTA: reveal after hero, hide over form/modal ──
(function() {
  const bar = document.querySelector('.sticky-cta');
  if (!bar) return;
  const hero = document.querySelector('.hero');
  const modal = document.getElementById('consult-modal');
  const formZones = Array.prototype.slice.call(
    document.querySelectorAll('.form-section, #consultation, .cta-section, .cta-strip, .site-footer')
  );
  let heroOut = !hero; // no hero (e.g. blog) → eligible to show on scroll
  const formsInView = new Set();

  function refresh() {
    const modalOpen = modal && modal.classList.contains('open');
    const show = heroOut && formsInView.size === 0 && !modalOpen;
    bar.classList.toggle('sticky-cta--visible', show);
  }

  if ('IntersectionObserver' in window) {
    if (hero) {
      new IntersectionObserver(function(entries) {
        heroOut = !entries[0].isIntersecting;
        refresh();
      }, { rootMargin: '-40px 0px 0px 0px' }).observe(hero);
    }
    if (formZones.length) {
      const fo = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) {
          if (e.isIntersecting) formsInView.add(e.target);
          else formsInView.delete(e.target);
        });
        refresh();
      });
      formZones.forEach(function(z) { fo.observe(z); });
    }
    if (modal) {
      new MutationObserver(refresh).observe(modal, { attributes: true, attributeFilter: ['class'] });
    }
  }
  if (!hero) {
    window.addEventListener('scroll', function() {
      heroOut = window.scrollY > window.innerHeight * 0.6;
      refresh();
    }, { passive: true });
  }
  refresh();
})();

// ── Consultation forms: two-step reveal + in-place AJAX success ──
(function() {
  // Step 1 → Step 2 reveal (progressive enhancement; no-JS shows all)
  document.querySelectorAll('form[data-multistep]').forEach(function(form) {
    const step2 = form.querySelector('.form-step-2');
    const advance = form.querySelector('.form-advance');
    const advanceBtn = form.querySelector('[data-form-advance]');
    const indicator = form.querySelector('.form-step-indicator');
    const backBtn = form.querySelector('[data-form-back]');
    if (!step2 || !advanceBtn) return;
    step2.hidden = true;
    advanceBtn.addEventListener('click', function() {
      const reqs = form.querySelectorAll('.form-step-1 [required]');
      for (let i = 0; i < reqs.length; i++) {
        if (!reqs[i].reportValidity()) return;
      }
      step2.hidden = false;
      if (advance) advance.hidden = true;
      if (indicator) indicator.hidden = true;
      const first = step2.querySelector('select, input, textarea');
      if (first) first.focus();
    });
    if (backBtn) backBtn.addEventListener('click', function() {
      step2.hidden = true;
      if (advance) advance.hidden = false;
      if (indicator) indicator.hidden = false;
      const f = form.querySelector('.form-step-1 input'); if (f) f.focus();
    });
  });

  // AJAX submit → show success in place (falls back to native POST on failure)
  function fmtDate(v) {
    if (!v) return '';
    const d = new Date(v + 'T00:00');
    if (isNaN(d)) return v;
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }
  document.querySelectorAll('form[data-ajax]').forEach(function(form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = form.querySelector('[type="submit"]');
      if (btn) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = 'Sending…'; }
      const data = new FormData(form);
      fetch(form.action, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } })
        .then(function(r) {
          if (!r.ok) throw new Error('bad response');
          const wrap = form.closest('[data-form-wrap]') || form.parentNode;
          const success = wrap.querySelector('[data-form-success]');
          if (!success) { window.location = form.querySelector('[name="_next"]') ? form.querySelector('[name="_next"]').value : '/'; return; }
          const dateVal = data.get('date');
          const dateLine = success.querySelector('[data-success-date-line]');
          const dateEl = success.querySelector('[data-success-date]');
          const dflt = success.querySelector('[data-success-default]');
          if (dateVal && dateEl && dateLine) {
            dateEl.textContent = fmtDate(dateVal);
            dateLine.hidden = false;
            if (dflt) dflt.hidden = true;
          }
          // Restate their selections as chips (mockup Frame 7)
          const tagWrap = success.querySelector('[data-success-tags]');
          if (tagWrap) {
            tagWrap.innerHTML = '';
            ['venue', 'budget', 'aesthetic'].forEach(function(name) {
              let v = data.get(name);
              if (!v || /not sure/i.test(v)) return;
              if (name === 'aesthetic') v = v.split(',')[0];
              const s = document.createElement('span');
              s.className = 'stag';
              s.textContent = v;
              tagWrap.appendChild(s);
            });
          }
          form.hidden = true;
          success.hidden = false;
          success.setAttribute('tabindex', '-1');
          success.scrollIntoView({ behavior: 'smooth', block: 'center' });
          success.focus();
        })
        .catch(function() {
          // Network/Formspree error → let the browser submit normally (uses _next redirect)
          if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label || 'Send'; }
          form.submit();
        });
    });
  });
})();

// ── Testimonials: reveal the rest on mobile ────────────
(function() {
  document.querySelectorAll('[data-testi-more]').forEach(function(btn) {
    const carousel = btn.closest('[data-testi]');
    const track = carousel ? carousel.querySelector('.testi-track') : null;
    if (!track) return;
    btn.addEventListener('click', function() {
      track.classList.remove('testi-collapsed');
      btn.setAttribute('aria-expanded', 'true');
      btn.style.display = 'none';
    });
  });
})();

// ── Blog search + load-more ────────────────────────────
(function() {
  const grid = document.getElementById('blog-grid');
  if (!grid) return;
  const input = document.getElementById('blog-search');
  const cards = Array.prototype.slice.call(grid.querySelectorAll('.blog-card'));
  const empty = document.getElementById('blog-empty');
  const count = document.getElementById('blog-count');
  const moreBtn = document.getElementById('blog-more');
  const BATCH = 12;
  let shown = BATCH;
  function apply() {
    const q = input ? input.value.trim().toLowerCase() : '';
    const searching = q.length > 0;
    let matched = 0, visible = 0;
    cards.forEach(function(c) {
      const hay = (c.dataset.title || '') + ' ' + (c.dataset.text || '');
      const isMatch = !q || hay.indexOf(q) !== -1;
      const show = searching ? isMatch : (matched < shown);
      if (isMatch) matched++;
      c.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    if (empty) empty.style.display = visible ? 'none' : 'block';
    if (count) count.textContent = (searching ? visible : cards.length) + (((searching ? visible : cards.length) === 1) ? ' post' : ' posts');
    if (moreBtn) moreBtn.style.display = (!searching && shown < cards.length) ? '' : 'none';
  }
  if (input) input.addEventListener('input', function() { shown = BATCH; apply(); });
  if (moreBtn) moreBtn.addEventListener('click', function() { shown += BATCH; apply(); });
  apply();
})();
// ── Scroll-reveal nav ──────────────────────────────────
(function() {
  const nav = document.getElementById('site-nav');
  let lastY = 0;
  let ticking = false;

  window.addEventListener('scroll', function() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        const y = window.scrollY;
        if (y > 80) {
          nav.classList.add('nav-scrolled');
          // Desktop: always visible. Mobile (≤1024): auto-hide on scroll-down.
          if (window.innerWidth <= 1024) {
            if (y > lastY + 4) {
              nav.classList.add('nav-hidden');
            } else if (y < lastY - 4) {
              nav.classList.remove('nav-hidden');
            }
          } else {
            nav.classList.remove('nav-hidden');
          }
        } else {
          nav.classList.remove('nav-scrolled');
          nav.classList.remove('nav-hidden');
        }
        lastY = y;
        ticking = false;
      });
      ticking = true;
    }
  });

  // Close mobile menu on outside click
  document.addEventListener('click', function(e) {
    if (!nav.contains(e.target)) {
      nav.classList.remove('nav-open');
      const t = nav.querySelector('.nav-toggle');
      if (t) t.setAttribute('aria-expanded', 'false');
    }
  });

  // Lock body scroll while the full-screen dark menu is open
  new MutationObserver(function() {
    document.body.classList.toggle('nav-menu-open', nav.classList.contains('nav-open'));
  }).observe(nav, { attributes: true, attributeFilter: ['class'] });
})();

// ── Testimonials carousel ──────────────────────────────
(function() {
  document.querySelectorAll('[data-testi]').forEach(function(carousel) {
    const track = carousel.querySelector('.testi-track');
    const prev = carousel.querySelector('[data-dir="prev"]');
    const next = carousel.querySelector('[data-dir="next"]');
    if (!track) return;

    function step() {
      const card = track.querySelector('.testi-card');
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return card ? card.getBoundingClientRect().width + gap : track.clientWidth;
    }
    function update() {
      const max = track.scrollWidth - track.clientWidth;
      if (prev) prev.disabled = track.scrollLeft <= 4;
      if (next) next.disabled = track.scrollLeft >= max - 4;
    }
    if (prev) prev.addEventListener('click', function() { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
    if (next) next.addEventListener('click', function() { track.scrollBy({ left: step(), behavior: 'smooth' }); });
    track.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  });
})();

// ── Active nav state ───────────────────────────────────
(function() {
  const rawPath = window.location.pathname.replace(/\/$/, '') || '/';
  const base = rawPath.indexOf('/goldenflowers') === 0 ? '/goldenflowers' : '';
  const currentPath = rawPath.replace(base, '') || '/';
  document.querySelectorAll('.nav-links a').forEach(function(link) {
    const href = (link.getAttribute('href') || '').split('#')[0].replace(/\/$/, '');
    const linkPath = href.replace(base, '') || '/';
    if (linkPath === '/') {
      if (currentPath === '/') link.classList.add('active');
    } else if (currentPath === linkPath || currentPath.startsWith(linkPath + '/')) {
      link.classList.add('active');
    }
  });
})();
</script>

</body>
</html>
