<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} · Golden Flowers{% else %}Lake Tahoe Wedding Florist | Golden Flowers{% endif %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/favicon-32.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/favicon-16.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/favicon-dark-32.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/favicon-dark-16.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v=26">
  
  {% seo %}

<body>

{% include header.html %}

{{ content }}

{% include footer.html %}

<div class="sticky-cta">
  <div class="sticky-cta-text">
    <strong>One wedding per date</strong>
  </div>
  <a href="{{ site.baseurl }}/weddings#consultation" data-consult-open>Check your date &rarr;</a>
</div>

{% include consult-modal.html %}

<script>
// ── Consultation modal (lightbox CTAs) ─────────────────
(function() {
  const modal = document.getElementById('consult-modal');
  if (!modal) return;
  let lastFocus = null;
  function open(e) {
    lastFocus = document.activeElement;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    const first = modal.querySelector('input, select, textarea, button');
    if (first) setTimeout(function() { first.focus(); }, 60);
  }
  function close() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    // If opened from the dark menu, close the menu too so we land back on the page
    const nav = document.getElementById('site-nav');
    if (nav && nav.classList.contains('nav-open')) {
      nav.classList.remove('nav-open');
      const t = nav.querySelector('.nav-toggle');
      if (t) t.setAttribute('aria-expanded', 'false');
    }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  // If the current page already has an inline consultation form, scroll to it
  // instead of opening the modal (avoids a modal-over-form redundancy).
  const inlineForm = document.querySelector('.form-section form, #consultation form');
  document.addEventListener('click', function(e) {
    const trigger = e.target.closest('a[href*="#consultation"]:not([href*="consultation-success"]), [data-consult-open]');
    if (trigger) {
      // data-consult-open always opens the modal (hero / sticky bar / menu).
      // Plain #consultation links scroll to an on-page form when one exists.
      const forceModal = trigger.hasAttribute('data-consult-open');
      if (inlineForm && !forceModal) {
        const target = document.getElementById('consultation') || inlineForm.closest('section');
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); }
        return;
      }
      e.preventDefault(); open(); return;
    }
    if (e.target === modal || e.target.closest('[data-consult-close]')) { close(); }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) close();
  });
})();

// ── Sticky mobile CTA: reveal after hero, hide over form/modal ──
(function() {
  const bar = document.querySelector('.sticky-cta');
  if (!bar) return;
  const hero = document.querySelector('.hero');
  const modal = document.getElementById('consult-modal');
  const formZones = Array.prototype.slice.call(
    document.querySelectorAll('.form-section, #consultation, .cta-section, .cta-strip, .site-footer')
  );
  let heroOut = !hero; // no hero (e.g. blog) → eligible to show on scroll
  const formsInView = new Set();

  function refresh() {
    const modalOpen = modal && modal.classList.contains('open');
    const show = heroOut && formsInView.size === 0 && !modalOpen;
    bar.classList.toggle('sticky-cta--visible', show);
  }

  if ('IntersectionObserver' in window) {
    if (hero) {
      new IntersectionObserver(function(entries) {
        heroOut = !entries[0].isIntersecting;
        refresh();
      }, { rootMargin: '-40px 0px 0px 0px' }).observe(hero);
    }
    if (formZones.length) {
      const fo = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) {
          if (e.isIntersecting) formsInView.add(e.target);
          else formsInView.delete(e.target);
        });
        refresh();
      });
      formZones.forEach(function(z) { fo.observe(z); });
    }
    if (modal) {
      new MutationObserver(refresh).observe(modal, { attributes: true, attributeFilter: ['class'] });
    }
  }
  if (!hero) {
    window.addEventListener('scroll', function() {
      heroOut = window.scrollY > window.innerHeight * 0.6;
      refresh();
    }, { passive: true });
  }
  refresh();
})();

// ── Consultation forms: two-step reveal + in-place AJAX success ──
(function() {
  // Step 1 → Step 2 reveal (progressive enhancement; no-JS shows all)
  document.querySelectorAll('form[data-multistep]').forEach(function(form) {
    const step1 = form.querySelector('.form-step-1');
    const step2 = form.querySelector('.form-step-2');
    const advance = form.querySelector('.form-advance');
    const advanceBtn = form.querySelector('[data-form-advance]');
    const indicator = form.querySelector('.form-step-indicator');
    const backBtn = form.querySelector('[data-form-back]');
    if (!step2 || !advanceBtn) return;
    step2.hidden = true;
    function toTop() { const m = form.closest('.modal'); if (m) m.scrollTop = 0; }
    advanceBtn.addEventListener('click', function() {
      const reqs = form.querySelectorAll('.form-step-1 [required]');
      for (let i = 0; i < reqs.length; i++) {
        if (!reqs[i].reportValidity()) return;
      }
      // Capture the lead now (date/name/email) so an abandoned step 2 still reaches us
      if (!form.dataset.partialSent && form.hasAttribute('data-ajax')) {
        form.dataset.partialSent = '1';
        try {
          const p = new FormData();
          ['date', 'name', 'email'].forEach(function(n) {
            const fld = form.querySelector('[name="' + n + '"]');
            if (fld) p.append(n, fld.value);
          });
          p.append('_subject', 'Date check started (Step 1): Golden Flowers');
          fetch(form.action, { method: 'POST', body: p, headers: { 'Accept': 'application/json' } });
        } catch (e) {}
      }
      if (step1) step1.hidden = true;          // page 2 no longer shows page 1's answers
      if (advance) advance.hidden = true;
      step2.hidden = false;
      if (indicator) indicator.textContent = 'Step 2 of 2';
      toTop();                                  // no auto-focus — avoids opening pickers
    });
    if (backBtn) backBtn.addEventListener('click', function() {
      step2.hidden = true;
      if (step1) step1.hidden = false;
      if (advance) advance.hidden = false;
      if (indicator) indicator.textContent = 'Step 1 of 2';
      toTop();                                  // no auto-focus — avoids opening the date picker
    });
  });

  // AJAX submit → show success in place (falls back to native POST on failure)
  function fmtDate(v) {
    if (!v) return '';
    const d = new Date(v + 'T00:00');
    if (isNaN(d)) return v;
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }
  document.querySelectorAll('form[data-ajax]').forEach(function(form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = form.querySelector('[type="submit"]');
      if (btn) { btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = 'Sending…'; }
      const data = new FormData(form);
      fetch(form.action, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } })
        .then(function(r) {
          if (!r.ok) throw new Error('bad response');
          const wrap = form.closest('[data-form-wrap]') || form.parentNode;
          const success = wrap.querySelector('[data-form-success]');
          if (!success) { window.location = form.querySelector('[name="_next"]') ? form.querySelector('[name="_next"]').value : '/'; return; }
          const dateVal = data.get('date');
          const dateLine = success.querySelector('[data-success-date-line]');
          const dateEl = success.querySelector('[data-success-date]');
          const dflt = success.querySelector('[data-success-default]');
          if (dateVal && dateEl && dateLine) {
            dateEl.textContent = fmtDate(dateVal);
            dateLine.hidden = false;
            if (dflt) dflt.hidden = true;
          }
          // Restate their selections as chips (mockup Frame 7)
          const tagWrap = success.querySelector('[data-success-tags]');
          if (tagWrap) {
            tagWrap.innerHTML = '';
            const chips = [];
            if (dateVal) chips.push(fmtDate(dateVal));
            ['aesthetic', 'budget'].forEach(function(name) {
              let v = data.get(name);
              if (!v || /not sure/i.test(v)) return;
              if (name === 'aesthetic') v = v.split(',')[0];
              chips.push(v);
            });
            chips.forEach(function(t) {
              const s = document.createElement('span');
              s.className = 'stag';
              s.textContent = t;
              tagWrap.appendChild(s);
            });
          }
          form.hidden = true;
          // Hide the form header (label / heading / intro) so the confirmation is its own clean view
          Array.prototype.forEach.call(wrap.children, function(el) {
            if (el !== success && !el.classList.contains('modal-close')) el.classList.add('is-gone');
          });
          success.hidden = false;
          success.setAttribute('tabindex', '-1');
          success.scrollIntoView({ behavior: 'smooth', block: 'center' });
          success.focus();
        })
        .catch(function() {
          // Network/Formspree error → let the browser submit normally (uses _next redirect)
          if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label || 'Send'; }
          form.submit();
        });
    });
  });
})();

// ── (removed) testimonials reveal — all reviews now swipeable ──
(function() {
  document.querySelectorAll('[data-testi-more]').forEach(function(btn) {
    const carousel = btn.closest('[data-testi]');
    const track = carousel ? carousel.querySelector('.testi-track') : null;
    if (!track) return;
    btn.addEventListener('click', function() {
      track.classList.remove('testi-collapsed');
      btn.setAttribute('aria-expanded', 'true');
      btn.style.display = 'none';
    });
  });
})();

// ── Blog search + load-more ────────────────────────────
(function() {
  const grid = document.getElementById('blog-grid');
  if (!grid) return;
  const input = document.getElementById('blog-search');
  const cards = Array.prototype.slice.call(grid.querySelectorAll('.blog-card'));
  const empty = document.getElementById('blog-empty');
  const count = document.getElementById('blog-count');
  const moreBtn = document.getElementById('blog-more');
  const BATCH = 12;
  let shown = BATCH;
  function apply() {
    const q = input ? input.value.trim().toLowerCase() : '';
    const searching = q.length > 0;
    let matched = 0, visible = 0;
    cards.forEach(function(c) {
      const hay = (c.dataset.title || '') + ' ' + (c.dataset.text || '');
      const isMatch = !q || hay.indexOf(q) !== -1;
      const show = searching ? isMatch : (matched < shown);
      if (isMatch) matched++;
      c.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    if (empty) empty.style.display = visible ? 'none' : 'block';
    if (count) count.textContent = (searching ? visible : cards.length) + (((searching ? visible : cards.length) === 1) ? ' post' : ' posts');
    if (moreBtn) moreBtn.style.display = (!searching && shown < cards.length) ? '' : 'none';
  }
  if (input) input.addEventListener('input', function() { shown = BATCH; apply(); });
  if (moreBtn) moreBtn.addEventListener('click', function() { shown += BATCH; apply(); });
  apply();
})();
// ── FAQ accordions (global; used on venue + weddings pages) ──
function toggleFaq(el) {
  var item = el.closest('.faq-item');
  var wasOpen = item.classList.contains('open');
  document.querySelectorAll('.faq-item.open').forEach(function(i) {
    i.classList.remove('open');
    var t = i.querySelector('.faq-toggle'); if (t) t.textContent = '+';
  });
  if (!wasOpen) {
    item.classList.add('open');
    var t = item.querySelector('.faq-toggle'); if (t) t.textContent = '×';
  }
}

// ── Scroll-reveal nav ──────────────────────────────────
(function() {
  const nav = document.getElementById('site-nav');
  let lastY = 0;
  let ticking = false;

  window.addEventListener('scroll', function() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        const y = window.scrollY;
        if (y > 80) {
          nav.classList.add('nav-scrolled');
          // Desktop: always visible. Mobile (≤1024): auto-hide on scroll-down.
          if (window.innerWidth <= 1024) {
            if (y > lastY + 4) {
              nav.classList.add('nav-hidden');
            } else if (y < lastY - 4) {
              nav.classList.remove('nav-hidden');
            }
          } else {
            nav.classList.remove('nav-hidden');
          }
        } else {
          nav.classList.remove('nav-scrolled');
          nav.classList.remove('nav-hidden');
        }
        // keep the venue breadcrumb in sync with the auto-hiding nav
        document.body.classList.toggle('chrome-hidden', nav.classList.contains('nav-hidden'));
        lastY = y;
        ticking = false;
      });
      ticking = true;
    }
  });

  // Close mobile menu on outside click
  document.addEventListener('click', function(e) {
    if (!nav.contains(e.target)) {
      nav.classList.remove('nav-open');
      const t = nav.querySelector('.nav-toggle');
      if (t) t.setAttribute('aria-expanded', 'false');
    }
  });

  // Lock body scroll while the full-screen dark menu is open
  new MutationObserver(function() {
    document.body.classList.toggle('nav-menu-open', nav.classList.contains('nav-open'));
  }).observe(nav, { attributes: true, attributeFilter: ['class'] });
})();

// ── Testimonials carousel ──────────────────────────────
(function() {
  document.querySelectorAll('[data-testi]').forEach(function(carousel) {
    const track = carousel.querySelector('.testi-track');
    const prev = carousel.querySelector('[data-dir="prev"]');
    const next = carousel.querySelector('[data-dir="next"]');
    if (!track) return;

    const countEl = carousel.querySelector('[data-testi-count]');
    const total = track.querySelectorAll('.testi-card').length;
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function updateCount() {
      if (!countEl || !total) return;
      var s = step() || 1;
      var i = Math.min(total - 1, Math.max(0, Math.round(track.scrollLeft / s)));
      countEl.textContent = pad(i + 1) + ' / ' + pad(total);
    }

    function step() {
      const card = track.querySelector('.testi-card');
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return card ? card.getBoundingClientRect().width + gap : track.clientWidth;
    }
    function maxScroll() { return track.scrollWidth - track.clientWidth; }
    function goNext() {
      if (track.scrollLeft >= maxScroll() - 4) track.scrollTo({ left: 0, behavior: 'smooth' });   // loop to start
      else track.scrollBy({ left: step(), behavior: 'smooth' });
    }
    function goPrev() {
      if (track.scrollLeft <= 4) track.scrollTo({ left: maxScroll(), behavior: 'smooth' });        // loop to end
      else track.scrollBy({ left: -step(), behavior: 'smooth' });
    }
    // Auto-advance with a countdown ring, driven by requestAnimationFrame.
    const playBtn = carousel.querySelector('[data-testi-toggle]');
    const ringBar = carousel.querySelector('.testi-ring-bar');
    const DUR = 6500;
    const C = 2 * Math.PI * 20;           // ring circumference (r = 20)
    var paused = false, startTime = 0, elapsed = 0, rafId = null;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function setRing(p) {                  // p = 0..1 elapsed
      if (ringBar) ringBar.style.strokeDashoffset = (C * (1 - Math.min(p, 1))).toFixed(2);
    }
    function frame(now) {
      elapsed = now - startTime;
      if (elapsed >= DUR) { goNext(); startTime = now; elapsed = 0; setRing(0); }
      else setRing(elapsed / DUR);
      rafId = requestAnimationFrame(frame);
    }
    function cancel() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
    function run(fromElapsed) {             // start the loop continuing from a given elapsed offset
      cancel();
      if (paused || reduce) return;
      elapsed = fromElapsed;
      startTime = performance.now() - fromElapsed;
      setRing(elapsed / DUR);
      rafId = requestAnimationFrame(frame);
    }
    function restart() { run(0); }          // countdown from the beginning
    function resume() { run(elapsed); }     // continue from where it was paused

    if (next) next.addEventListener('click', function() { paused = false; setPlayBtn(); goNext(); restart(); });
    if (prev) prev.addEventListener('click', function() { paused = false; setPlayBtn(); goPrev(); restart(); });
    function setPlayBtn() {
      if (!playBtn) return;
      playBtn.classList.toggle('is-paused', paused);
      playBtn.setAttribute('aria-label', paused ? 'Resume auto-advance' : 'Pause auto-advance');
    }
    if (playBtn) playBtn.addEventListener('click', function() {
      paused = !paused;
      setPlayBtn();
      if (paused) { cancel(); } else { resume(); }   // resume from where it stopped, not from zero
    });
    track.addEventListener('scroll', updateCount, { passive: true });
    setRing(0);
    updateCount();
    // Don't start the countdown until the section is first scrolled into view,
    // so the intended first review isn't auto-advanced past before it's seen.
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(entries) {
        entries.forEach(function(e) { if (e.isIntersecting) { restart(); io.disconnect(); } });
      }, { threshold: 0.4 });
      io.observe(carousel);
    } else {
      restart();
    }
  });
})();

// ── Expose the real nav height (it varies; --nav-h is only an estimate) ──
(function() {
  var nav = document.getElementById('site-nav');
  if (!nav) return;
  function set() { document.documentElement.style.setProperty('--nav-real', nav.offsetHeight + 'px'); }
  set();
  window.addEventListener('resize', set);
  window.addEventListener('load', set);
})();

// ── Active nav state ───────────────────────────────────
(function() {
  const rawPath = window.location.pathname.replace(/\/$/, '') || '/';
  const base = rawPath.indexOf('/goldenflowers') === 0 ? '/goldenflowers' : '';
  const currentPath = rawPath.replace(base, '') || '/';
  document.querySelectorAll('.nav-links a').forEach(function(link) {
    const href = (link.getAttribute('href') || '').split('#')[0].replace(/\/$/, '');
    const linkPath = href.replace(base, '') || '/';
    if (linkPath === '/') {
      if (currentPath === '/') link.classList.add('active');
    } else if (currentPath === linkPath || currentPath.startsWith(linkPath + '/')) {
      link.classList.add('active');
    }
  });
})();
</script>
