<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} · Golden Flowers{% else %}Lake Tahoe Wedding Florist | Golden Flowers{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v=25">
  
  {% seo %}
</head>
<body>

{% include header.html %}

{{ content }}

{% include footer.html %}

{% include consult-modal.html %}

<script>
// ── Consultation modal (lightbox CTAs) ─────────────────
(function() {
  const modal = document.getElementById('consult-modal');
  if (!modal) return;
  let lastFocus = null;
  function open(e) {
    lastFocus = document.activeElement;
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    const first = modal.querySelector('input, select, textarea, button');
    if (first) setTimeout(function() { first.focus(); }, 60);
  }
  function close() {
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    if (lastFocus) lastFocus.focus();
  }
  // If the current page already has an inline consultation form, scroll to it
  // instead of opening the modal (avoids a modal-over-form redundancy).
  const inlineForm = document.querySelector('.form-section form, #consultation form');
  document.addEventListener('click', function(e) {
    const trigger = e.target.closest('a[href*="#consultation"]:not([href*="consultation-success"]), [data-consult-open]');
    if (trigger) {
      if (inlineForm) {
        const target = document.getElementById('consultation') || inlineForm.closest('section');
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); }
        return;
      }
      e.preventDefault(); open(); return;
    }
    if (e.target === modal || e.target.closest('[data-consult-close]')) { close(); }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('open')) close();
  });
})();

// ── Blog search + load-more ────────────────────────────
(function() {
  const grid = document.getElementById('blog-grid');
  if (!grid) return;
  const input = document.getElementById('blog-search');
  const cards = Array.prototype.slice.call(grid.querySelectorAll('.blog-card'));
  const empty = document.getElementById('blog-empty');
  const count = document.getElementById('blog-count');
  const moreBtn = document.getElementById('blog-more');
  const BATCH = 12;
  let shown = BATCH;
  function apply() {
    const q = input ? input.value.trim().toLowerCase() : '';
    const searching = q.length > 0;
    let matched = 0, visible = 0;
    cards.forEach(function(c) {
      const hay = (c.dataset.title || '') + ' ' + (c.dataset.text || '');
      const isMatch = !q || hay.indexOf(q) !== -1;
      const show = searching ? isMatch : (matched < shown);
      if (isMatch) matched++;
      c.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    if (empty) empty.style.display = visible ? 'none' : 'block';
    if (count) count.textContent = (searching ? visible : cards.length) + (((searching ? visible : cards.length) === 1) ? ' post' : ' posts');
    if (moreBtn) moreBtn.style.display = (!searching && shown < cards.length) ? '' : 'none';
  }
  if (input) input.addEventListener('input', function() { shown = BATCH; apply(); });
  if (moreBtn) moreBtn.addEventListener('click', function() { shown += BATCH; apply(); });
  apply();
})();
// ── Scroll-reveal nav ──────────────────────────────────
(function() {
  const nav = document.getElementById('site-nav');
  let lastY = 0;
  let ticking = false;

  window.addEventListener('scroll', function() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        const y = window.scrollY;
        if (y > 80) {
          nav.classList.add('nav-scrolled');
          // Desktop: always visible. Mobile (≤1024): auto-hide on scroll-down.
          if (window.innerWidth <= 1024) {
            if (y > lastY + 4) {
              nav.classList.add('nav-hidden');
            } else if (y < lastY - 4) {
              nav.classList.remove('nav-hidden');
            }
          } else {
            nav.classList.remove('nav-hidden');
          }
        } else {
          nav.classList.remove('nav-scrolled');
          nav.classList.remove('nav-hidden');
        }
        lastY = y;
        ticking = false;
      });
      ticking = true;
    }
  });

  // Close mobile menu on outside click
  document.addEventListener('click', function(e) {
    if (!nav.contains(e.target)) {
      nav.classList.remove('nav-open');
      const t = nav.querySelector('.nav-toggle');
      if (t) t.setAttribute('aria-expanded', 'false');
    }
  });
})();

// ── Testimonials carousel ──────────────────────────────
(function() {
  document.querySelectorAll('[data-testi]').forEach(function(carousel) {
    const track = carousel.querySelector('.testi-track');
    const prev = carousel.querySelector('[data-dir="prev"]');
    const next = carousel.querySelector('[data-dir="next"]');
    if (!track) return;

    function step() {
      const card = track.querySelector('.testi-card');
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return card ? card.getBoundingClientRect().width + gap : track.clientWidth;
    }
    function update() {
      const max = track.scrollWidth - track.clientWidth;
      if (prev) prev.disabled = track.scrollLeft <= 4;
      if (next) next.disabled = track.scrollLeft >= max - 4;
    }
    if (prev) prev.addEventListener('click', function() { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
    if (next) next.addEventListener('click', function() { track.scrollBy({ left: step(), behavior: 'smooth' }); });
    track.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  });
})();

// ── Active nav state ───────────────────────────────────
(function() {
  const rawPath = window.location.pathname.replace(/\/$/, '') || '/';
  const base = rawPath.indexOf('/goldenflowers') === 0 ? '/goldenflowers' : '';
  const currentPath = rawPath.replace(base, '') || '/';
  document.querySelectorAll('.nav-links a').forEach(function(link) {
    const href = (link.getAttribute('href') || '').split('#')[0].replace(/\/$/, '');
    const linkPath = href.replace(base, '') || '/';
    if (linkPath === '/') {
      if (currentPath === '/') link.classList.add('active');
    } else if (currentPath === linkPath || currentPath.startsWith(linkPath + '/')) {
      link.classList.add('active');
    }
  });
})();
</script>

</body>
</html>
