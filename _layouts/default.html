<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.seo_title %}{{ page.seo_title }}{% elsif page.title %}{{ page.title }} · Golden Flowers{% else %}Lake Tahoe Wedding Florist | Golden Flowers{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v=14">
  
  {% seo %}
</head>
<body>

{% include header.html %}

{{ content }}

{% include footer.html %}

<script>
// ── Scroll-reveal nav ──────────────────────────────────
(function() {
  const nav = document.getElementById('site-nav');
  let lastY = 0;
  let ticking = false;

  window.addEventListener('scroll', function() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        const y = window.scrollY;
        if (y > 80) {
          nav.classList.add('nav-scrolled');
          if (y > lastY + 4) {
            nav.classList.add('nav-hidden');
          } else if (y < lastY - 4) {
            nav.classList.remove('nav-hidden');
          }
        } else {
          nav.classList.remove('nav-scrolled');
          nav.classList.remove('nav-hidden');
        }
        lastY = y;
        ticking = false;
      });
      ticking = true;
    }
  });

  // Close mobile menu on outside click
  document.addEventListener('click', function(e) {
    if (!nav.contains(e.target)) {
      nav.classList.remove('nav-open');
    }
  });
})();

// ── Active nav state ───────────────────────────────────
(function() {
  const path = window.location.pathname;
  document.querySelectorAll('.nav-links a').forEach(function(link) {
    const href = link.getAttribute('href');
    if (href && path.endsWith(href.replace('/goldenflowers', '').split('#')[0])) {
      link.classList.add('active');
    }
  });
})();
</script>

</body>
</html>
