<script>
/* Smart sticky header: transparent at top, solid once scrolled,
   hides on scroll-down and reveals on scroll-up. */
(function(){
  var nav=document.getElementById('site-nav'); if(!nav) return;
  var hasHero=!!document.querySelector('.hero');   // no hero (e.g. article) => nav stays solid
  var last=0, ticking=false;
  function update(){
    var y=window.pageYOffset;
    nav.classList.toggle('solid', !hasHero || y>40);
    if(y>last && y>500){ nav.classList.add('up'); }
    else { nav.classList.remove('up'); }
    last=y; ticking=false;
  }
  update();
  window.addEventListener('scroll',function(){
    if(!ticking){ requestAnimationFrame(update); ticking=true; }
  },{passive:true});
})();

/* Mobile menu: any [data-menu-toggle] toggles; links + Esc close. */
(function(){
  var toggles=document.querySelectorAll('[data-menu-toggle]'); if(!toggles.length) return;
  function set(open){
    document.body.classList.toggle('menu-open', open);
    toggles.forEach(function(b){ b.setAttribute('aria-expanded', open?'true':'false'); b.setAttribute('aria-label', open?'Close menu':'Open menu'); });
  }
  toggles.forEach(function(b){ b.addEventListener('click', function(){ set(!document.body.classList.contains('menu-open')); }); });
  document.querySelectorAll('.mobile-menu a').forEach(function(a){ a.addEventListener('click', function(){ set(false); }); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') set(false); });
})();
</script>
