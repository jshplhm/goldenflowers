title: "Golden Flowers"
description: "Lake Tahoe wedding florist specializing in sustainable, locally-grown, foam-free floral design"

url: "https://jshplhm.github.io"
baseurl: "/goldenflowers"

# Permalink setting
permalink: /:categories/:title/

# Collections
collections:
  posts:
    permalink: /:path/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-redirect-from

# SEO
author:
  name: "Brittany"
  email: "brittany@goldenflorals.com"

# Build settings
markdown: kramdown
timezone: "America/Los_Angeles"
encoding: utf-8

# Exclude files from the output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - .jekyll-metadata

# Front matter defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Brittany"
      v3: true
