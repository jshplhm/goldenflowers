title: "Golden Flowers"
description: "Lake Tahoe wedding florist specializing in sustainable, locally-grown, foam-free floral design"

# ⚠️ CUTOVER STEP: when pointing goldenflorals.com DNS at this repo, change to:
#   url: "https://goldenflorals.com"
#   baseurl: ""
# This is what makes the home page, blog index, and all 35 posts canonicalize to the
# production domain (interior pages already pin canonical_url in their front matter).
# Do NOT flip until cutover: it breaks the jshplhm.github.io/goldenflowers staging URL.
url: "https://jshplhm.github.io"
baseurl: "/goldenflowers"

# Permalink setting
permalink: /:categories/:title/

# Collections
collections:
  posts:
    permalink: /:path/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-redirect-from

# SEO
author:
  name: "Brittany"
  email: "brittany@goldenflorals.com"

# Build settings
markdown: kramdown
timezone: "America/Los_Angeles"
encoding: utf-8

# Exclude files from the output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - .jekyll-metadata
  # Internal design artifacts: keep out of the published site and sitemap
  - redesign-fonts.html
  - redesign-fonts2.html
  - redesign-fonts3.html
  - redesign-preview.html
  - redesign-preview-newsreader.html
  - ds-bundle
  - handoff

# Front matter defaults
defaults:
  - scope:
      path: ""
    values:
      # Default social-share / og:image (pages may override with their own `image:`)
      image: "/assets/images/portfolio/lynn-aaron/lynn-aaron-19.jpg"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Brittany"
