site: "Golden Flowers | Lake Tahoe Wedding Florist"
url: "https://jshplhm.github.io/goldenflowers"
baseurl: "/goldenflowers"

# Permalink setting - posts override this with their own permalink in frontmatter
permalink: /:categories/:title/

# Collections
collections:
  posts:
    permalink: /:path/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate-v2

# SEO
title: "Golden Flowers"
description: "Lake Tahoe wedding florist specializing in sustainable, locally-grown, foam-free floral design"
author:
  name: "Brittany"
  email: "brittany@goldenflorals.com"

# Build settings
markdown: kramdown
timezone: "America/Los_Angeles"
encoding: utf-8

# Exclude files from the output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - .jekyll-metadata

# Front matter defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Brittany"
