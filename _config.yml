title: "Golden Flowers"
description: "Lake Tahoe wedding florist specializing in sustainable, locally-grown, foam-free floral design"

url: "https://goldenflorals.com"
baseurl: ""

# Permalink setting
permalink: /:categories/:title/

# Collections
collections:
  posts:
    permalink: /:path/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-redirect-from

# Consultation form endpoint — the Google Apps Script web app that writes to the
# leads sheet. If the script is ever redeployed under a new URL, this is the only
# place to update it (the contact page form and the modal both read it from here).
consult_endpoint: "https://script.google.com/macros/s/AKfycbxYl9LaejM3x9ntYuXwWDvHbIFArpCHTBAhSCqq6ZY6mvxa6c9aUsXeNZPlzQLKAdSMbw/exec"

# Analytics — paste your GA4 Measurement ID (looks like G-XXXXXXXXXX) to turn on tracking.
# Get it at analytics.google.com → Admin → Data streams → your web stream. Left blank =
# analytics off (safe for staging). The _includes/analytics.html tag only fires when set.
google_analytics: "G-LSEQ0EKDLD"

# SEO
author:
  name: "Brittany"
  email: "brittany@goldenflorals.com"

# Build settings
markdown: kramdown
timezone: "America/Los_Angeles"
encoding: utf-8

# Exclude files from the output
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - .jekyll-metadata
  # Internal design artifacts: keep out of the published site and sitemap
  - redesign-fonts.html
  - redesign-fonts2.html
  - redesign-fonts3.html
  - redesign-preview.html
  - redesign-preview-newsreader.html
  - ds-bundle
  - handoff
  # Local-only internal docs (gitignored, absent in CI): excluded so a local
  # build never copies them into _site
  - audit
  - seo-report
  - proposal-archive

# Front matter defaults
defaults:
  - scope:
      path: ""
    values:
      # Default social-share / og:image (pages may override with their own `image:`)
      image: "/assets/images/portfolio/lynn-aaron/lynn-aaron-19.jpg"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Brittany"
